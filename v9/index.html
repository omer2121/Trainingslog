<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Trainingslog</title>
<style>
/* ---------- Farben, Maße, Schrift ----------
   Dunkles Design für schlecht beleuchtete Studios. Systemschrift (SF Pro auf
   dem iPhone): lädt sofort und funktioniert offline. Diagrammfarben (--series,
   --cal-*) sind mit dem Palette-Validator gegen --surface geprüft. */
:root{
  color-scheme:dark;
  --bg:#0B0C0F;
  --surface:#15171B;
  --surface-2:#1C1F25;
  --surface-3:#262A31;
  --line:#24272E;
  --line-2:#30343C;
  --text:#F3F4F6;
  --text-2:#B9BFC9;
  --muted:#8A919D;
  --faint:#6B7280;
  --accent:#C6FB50;
  --accent-ink:#0A0B0D;
  --accent-soft:rgba(198,251,80,.12);
  --series:#73A402;
  --track:rgba(115,164,2,.22);
  --cal-0:#20232A;
  --cal-1:#3A5612;
  --cal-2:#4F7314;
  --cal-3:#73A402;
  --good:#3BA946;
  --warn:#F2B33D;
  --bad:#E95145;
  --good-soft:rgba(59,169,70,.15);
  --warn-soft:rgba(242,179,61,.12);
  --bad-soft:rgba(233,81,69,.14);
  --grid:#23262D;
  --axis:#3A3F48;
  --r-lg:18px;
  --r-md:14px;
  --tab-h:62px;
  --pad:16px;
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.45;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:contain;
}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:var(--accent)}
.ic{width:22px;height:22px;flex:none}
.ic.sm{width:16px;height:16px}
.ic.xs{width:13px;height:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px)}
body.dock-on #app{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 112px)}

/* ---------- Kopf (bleibt oben stehen) ---------- */
.hdr{
  position:sticky;top:0;z-index:30;
  background:rgba(11,12,15,.86);
  -webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 0;
}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:36px}
.hdr-title{margin:0 auto 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.pill{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line-2);font-weight:700;font-size:14px;white-space:nowrap;
}
.pill em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px}
.pill .ic{color:var(--muted)}
.pill.static{font-weight:600;color:var(--text-2)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);margin-left:auto}
.seg button{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;
  font-size:13.5px;font-weight:650;color:var(--muted);transition:background .2s,color .2s;
}
.seg button.on{background:var(--text);color:var(--accent-ink)}
.days{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dc{
  position:relative;flex:1 0 58px;min-height:54px;padding:7px 4px 11px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);text-align:center;
  transition:background .2s,border-color .2s,color .2s;
}
.dc b{display:block;font-size:14px;font-weight:800;letter-spacing:.05em}
.dc span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap}
.dc.on{background:var(--text);border-color:var(--text);color:var(--accent-ink)}
.dc.on span{color:#3A3F48}
.dc .dp{position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden}
.dc.on .dp{background:rgba(10,11,13,.14)}
.dc .dp u{display:block;height:100%;background:var(--accent);border-radius:2px}
.dc.on .dp u{background:#3D6B00}
.dc.today::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dc.on.today::after{background:#3D6B00}
.hprog{height:3px;margin:0 calc(-1 * var(--pad))}
.hprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s var(--ease)}
.warn{display:none;margin:10px var(--pad) 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.warn.on{display:block}

/* ---------- Ansichten ---------- */
.view{padding:18px var(--pad) 0}
.eyebrow{margin:0 0 5px;font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--accent);font-weight:800}
.title{margin:0;font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.sub{margin:7px 0 0;color:var(--text-2);font-size:14.5px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.stat{display:inline-flex;align-items:baseline;gap:5px;padding:7px 11px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.stat b{color:var(--text);font-size:15px;font-weight:750}
.sec-h{margin:26px 2px 0;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fine{margin:10px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.lead{margin:0 0 4px;font-size:14.5px;color:var(--text-2)}

/* ---------- Knöpfe, Hinweise ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:13px;
  font-weight:700;font-size:14.5px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);
  transition:transform .12s var(--ease),background .2s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:#FF8A80;border-color:rgba(233,81,69,.38);background:transparent}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{display:flex;width:100%;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.banner{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:13px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.banner > .ic{color:var(--accent);margin-top:1px}
.banner p{margin:0;font-size:14px;color:var(--text-2)}
.banner b{color:var(--text)}
.banner .acts{display:flex;gap:8px;margin-top:10px}

/* ---------- Übungskarte ---------- */
.ex{
  margin:14px 0 0;border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(180deg,#181A1F 0%,var(--surface) 70%);border:1px solid var(--line);
  scroll-margin-top:calc(env(safe-area-inset-top) + 140px);
  transition:border-color .3s;
}
.ex.complete{border-color:rgba(198,251,80,.24)}
.ex-h{display:flex;gap:12px;padding:14px 14px 0}
.ex-num{
  flex:none;width:30px;height:30px;margin-top:1px;border-radius:9px;display:grid;place-items:center;
  background:var(--surface-3);font-size:12px;font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums;
}
.ex.complete .ex-num{background:var(--accent);color:var(--accent-ink)}
.ex-t{flex:1;min-width:0}
.ex-t h3{margin:2px 0 0;font-size:17px;line-height:1.25;font-weight:750;letter-spacing:-.01em}
.ex-g{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.ib{flex:none;width:42px;height:42px;margin:-6px -8px 0 0;border-radius:12px;display:grid;place-items:center;color:var(--text-2)}
.ib:active{background:var(--surface-3)}
.tags{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:7px;vertical-align:2px}
.tag{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-3);color:var(--text-2);
}
.tag.pr{background:var(--accent);color:var(--accent-ink)}
.tag.red{background:var(--warn-soft);color:var(--warn)}
.tag.deload{background:var(--good-soft);color:#8FE08F}
.tag.lead{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--text-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.chip .ic{width:14px;height:14px;color:var(--muted)}
button.chip:active{background:var(--surface-3)}
.chip.ghost{background:transparent;color:var(--muted)}

/* ---------- Satzzeilen ---------- */
.sets{padding:10px 10px 4px}
.sets-h,.set{display:grid;grid-template-columns:26px 1fr 1fr .78fr 46px;gap:7px;align-items:center}
.sets-h{padding:0 4px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sets-h span{text-align:center}
.set{position:relative;padding:5px 4px;border-radius:13px;transition:background .25s}
.set + .set{margin-top:2px}
.sn{font-size:13px;font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.fw{position:relative;display:block}
.in{
  display:block;width:100%;height:48px;padding:0 4px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--text);text-align:center;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s;
}
.in::placeholder{color:var(--faint);font-weight:500;opacity:1}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chk{
  width:46px;height:48px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line-2);color:var(--faint);
  transition:transform .15s var(--ease),background .2s,color .2s,border-color .2s;
}
.chk .ic{width:22px;height:22px;stroke-width:2.6}
.chk:active{transform:scale(.9)}
.set.done{background:rgba(198,251,80,.055)}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.go .in[data-f=r]{border-color:rgba(59,169,70,.85)}
.set.under .in[data-f=r]{border-color:rgba(233,81,69,.85);color:#FF8A80}
.beat-b{
  position:absolute;top:-6px;right:-5px;width:19px;height:19px;border-radius:50%;
  display:none;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--surface);
}
.beat-b .ic{width:11px;height:11px;stroke-width:3.2}
.set.beat .beat-b{display:grid}
.set.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* ---------- Kartenfuß: Urteil, Hinweise, Aufwärmen ---------- */
.ex-foot{display:grid;gap:8px;padding:6px 14px 14px}
.vd{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;font-weight:700}
.vd .ic{width:18px;height:18px;stroke-width:2.4}
.vd em{margin-left:auto;font-style:normal;font-weight:550;color:var(--muted);font-size:12.5px;text-align:right}
.vd.up{background:var(--good-soft)}
.vd.up .ic{color:var(--good)}
.vd.down{background:var(--bad-soft)}
.vd.down .ic{color:var(--bad)}
.vd.hold .ic{color:var(--muted)}
.note{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn-soft);font-size:13px;color:var(--text-2)}
.note .ic{width:17px;height:17px;color:var(--warn);margin-top:1px}
.note b{color:var(--text)}
.wu{display:flex;gap:7px;align-items:flex-start;margin:0;padding:0 2px;font-size:12.5px;color:var(--muted)}
.wu .ic{margin-top:2px;color:var(--faint)}
.wu b{color:var(--text-2);font-weight:650}

/* ---------- Ende des Trainingstags ---------- */
.day-end{margin:22px 0 0;padding:18px;border-radius:var(--r-lg);border:1px dashed var(--line-2);text-align:center}
.day-end h3{margin:0 0 4px;font-size:16px;font-weight:750}
.day-end p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.key{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin:16px 0 0;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2)}
.key i .ic{width:11px;height:11px;stroke-width:3}
.key .k-done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.key .k-go{border-color:rgba(59,169,70,.85)}
.key .k-under{border-color:rgba(233,81,69,.85)}
.key .k-beat{border-radius:50%;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- Tab-Leiste ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,14,17,.9);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);
  border-top:1px solid var(--line);
}
.tabbar-in{display:flex;width:100%;max-width:640px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--faint);transition:color .2s}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--text)}
.tab.on .ic{color:var(--accent)}

/* ---------- Pausen-Uhr ---------- */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);z-index:45;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px);
  width:calc(100% - 24px);max-width:616px;display:flex;align-items:center;gap:10px;
  padding:10px 10px 10px 12px;border-radius:20px;background:rgba(30,33,39,.97);border:1px solid var(--line-2);
  box-shadow:0 14px 40px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
.dock[hidden]{display:none}
.ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:var(--surface-3)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.dk-mid{flex:1;min-width:0}
.dk-mid b{display:block;font-size:25px;line-height:1.05;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dk-mid span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-b{height:42px;min-width:48px;padding:0 10px;border-radius:12px;background:var(--surface-3);font-weight:750;font-size:13.5px;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.dock.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pulse 1s var(--ease) 3}
.dock.done .ring{display:none}
.dock.done .dk-mid span{color:#2C3B06}
.dock.done .dk-b{background:rgba(10,11,13,.12);color:var(--accent-ink)}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.03)}}

/* ---------- Blätter (Bottom Sheets) ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,8,0);transition:background .24s}
.sheet[hidden]{display:none}
.sheet.open{background:rgba(5,6,8,.66)}
.sh{
  width:100%;max-width:640px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:24px 24px 0 0;
  padding:8px var(--pad) calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s var(--ease);
}
.sheet.open .sh{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-head h2{flex:1;margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em}
.sh-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.sh h4{margin:18px 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sh p,.sh li{font-size:14.5px;color:var(--text-2)}
.sh p{margin:0}
.sh ol,.sh ul{margin:0;padding-left:20px}
.sh li{margin:5px 0}
.vid{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin-top:6px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--text-2);font-size:13.5px}
.vid .ic{color:var(--accent);margin-top:2px}
.vid b{display:block;color:var(--text);font-weight:700}
.alts{display:grid;gap:6px}
.alt{display:flex;align-items:center;gap:8px;width:100%;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left;font-size:14px;color:var(--text-2)}
.alt small{margin-left:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.alt .ic{margin-left:auto;color:var(--accent)}
.alt.on{border-color:var(--accent);color:var(--text)}
textarea{
  display:block;width:100%;height:200px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;
}
.wk-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.wk-c{position:relative;height:46px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.wk-c i{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p) * 100%);background:var(--accent)}
.wk-c.on{background:var(--text);border-color:var(--text);color:var(--accent-ink)}
.wk-c.on i{background:#3D6B00}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{padding:11px 6px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:750;font-size:14px}
.seg3 small{display:block;margin-top:2px;font-weight:550;font-size:11.5px;color:var(--muted)}
.seg3 button.on{background:var(--text);border-color:var(--text);color:var(--accent-ink)}
.seg3 button.on small{color:#3A3F48}
.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.ci-grid label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

<template id="tpl-rules">
      <h4>Schwachstellen · V9.4</h4>
      <ul>
        <li>Fotos vom 23.10.: Seitliche und hintere Schulter sind deine Stärke. Obere Brust und Lat-Breite (vor allem unten am Rücken) hängen hinterher. Beine waren nicht zu sehen und bleiben unverändert.</li>
        <li>V9.1: 4 Sätze weg von den Schultern, hin zu Brust und Lats: Mo Latzug 3→4, Low-to-High Fly 2→3, Seitheben 3→2, Reverse Pec Deck 2→1 · Do Lat-Rudern 2→3, Reverse Pec Deck 3→2 · Fr Schrägbrust 4→5, Seithebemaschine 5→4. Schultern laufen auf Erhaltung: seitlich 6, hinten 3 plus Anteile aus dem Rudern.</li>
        <li>V9.2, Arm-Priorität: Do Preacher Curl 2→3, Fr Rope Pushdown 2→3, neu Di Überkopf-Trizeps 3 Sätze und Sa Kurzhantel-Curl auf der Schrägbank 2 Sätze. Bizeps 9 direkte Sätze, Trizeps 11. Zusammen 96 statt 89 Sätze.</li>
        <li>Warum trotz Defizit mehr Sätze: Ohne AAS wächst im Defizit kaum Muskel, mehr Sätze bringen dort keinen belegten Vorteil (Roth 2023). Unter Testosteron stieg die fettfreie Masse in einem 55-%-Defizit um 2,5 kg gegenüber Placebo (Pasiakos 2019, 4 Wochen, Messung inkl. Wasser). Dass Testosteron-Nutzer mehr Umfang vertragen, ist nicht belegt; die Armsätze liegen deshalb im normalen Bereich, nicht darüber.</li>
        <li>Fällt der Cut-Check an: Modus „Reduziert“ nimmt bei jeder Isolationsübung einen Satz weg, also auch die neuen Armsätze zuerst.</li>
        <li>V9.3, Übungen nach den Fotos: Do Latzug im Untergriff statt High Row (oberer Rücken ist stark, Lats nicht) und Fr Schrägbank-Kabelfly 30° statt Pec Deck (untere Brust gut, obere flach). Alte Einträge behalten ihren Namen; der Vergleich startet bei der neuen Übung frisch.</li>
        <li>Kein Shrug-Training: Ein eher flacher oberer Trapez lässt die Schultern breiter wirken.</li>
        <li>V9.4: Schrägbrust Fr wieder 4 statt 5 Sätze, dafür Schrägbank-Kabelfly 2→3. Pro Woche bleibt die obere Brust bei 14 Sätzen. Üblich sind 3–4 Arbeitssätze pro Übung; ein 5. Satz derselben Übung bringt nach viel Ermüdung wenig, etwas Übungsvariation hilft dagegen dem Wachstum in einzelnen Muskelbereichen (Kassiano 2022).</li>
        <li>Zuhause hat die Bank nur 20° und 40°: Schrägbankdrücken und Schrägbank-Fly auf 40°. Die obere Brust ist zwischen 30° und 45° am aktivsten, über 45° übernimmt die vordere Schulter (Rodríguez-Ridao 2020, EMG). 20° liegt näher an der Flachbank. Spürst du bei 40° fast nur die Schulter, nimm 20°. Der Vergleich startet bei 40° frisch, weil die alten Einträge (20–30°) mit anderem Winkel entstanden sind.</li>
      </ul>
      <h4>Cut-Regeln</h4>
      <ul>
        <li>Ziel im Cut: Kraft mindestens halten. Steigerungen sind im Defizit möglich (Murphy &amp; Koehler 2022); Sätze bleiben gleich, gesteigert wird über Last und Wiederholungen. Leitübungen sind die schweren Grundübungen: Smith-Schrägbank, T-Bar Row, Hack Squat, RDL und Smith Split Squat.</li>
        <li>Im Defizit Last und Umfang halten: Es gibt keinen Beleg dafür, dass weniger Sätze im Cut Muskeln schützen.</li>
        <li>„Cut-Check“ erscheint, wenn eine Leitübung zwei Einheiten hintereinander mehr als 5 % unter ihrem Bestwert davor liegt (geschätztes Maximum aus Satz 1). Dann zuerst Schlaf, Essen und Pausen prüfen. Erst wenn es so bleibt: Modus „Reduziert“ (jede Isolationsübung einen Satz weniger, Last und RIR bleiben). Das ist ein praktisches Werkzeug, keine belegte Methode.</li>
        <li>Deload: Ob geplante Deloads nötig sind, ist nicht belegt; eine Woche Pause kostete in einer Studie kein Wachstum (Coleman 2024). Einsetzen beim Übergang vom Cut in den Aufbau oder bei deutlicher Erschöpfung: etwa halbe Satzzahl, gleiche Last, RIR 3. Deload-Wochen zählen nicht für den Cut-Check.</li>
        <li>Abnahme etwa 0,5–1 % Körpergewicht pro Woche im Wochendurchschnitt; mit 0,7 % pro Woche blieb mehr Muskelmasse erhalten als mit schnellerem Abnehmen (Garthe 2011). Eiweiß 2,3–3,1 g pro kg fettfreie Masse.</li>
        <li>Cardio: Gehen (10.000–12.000 Schritte) oder Rad. Laufen und HIIT sparsam und nicht vor Beintagen, sonst stört es mehr.</li>
        <li>Isolationsübungen: letzter Satz 0–1 RIR, wenn die Erholung stimmt. Grund- und Druckübungen bleiben bei 1–2, der RDL bei 2.</li>
      </ul>
      <h4>Aufwärmen</h4>
      <ul>
        <li>3 Sätze: 40–50 % × 8–10 · 65–70 % × 4–5 · 80–85 % × 1–3</li>
        <li>2 Sätze: 50–60 % × 6–8 · 75–80 % × 3–4</li>
        <li>1 Satz: 50–60 % × 6–8</li>
        <li>0–1: nur wenn du nicht schon warm bist, dann 1 Satz.</li>
        <li>Prozent vom geplanten Arbeitsgewicht. Zwischen leichten Stufen 45–90 s, vor dem ersten Arbeitssatz 2–3 min. Aufwärmsätze nicht loggen.</li>
      </ul>
      <h4>Ausführung und Videos</h4>
      <ul>
        <li>An jeder Übung oben rechts das ⓘ antippen: Schritt-für-Schritt-Ausführung, typische Fehler und ein Technik-Video von Science-based-Liftern (TNF, Jeff Nippard, Renaissance Periodization u. a.). Die Videos sind auf Englisch.</li>
        <li>Zuhause zeigt die App die Ausführung der KSK-Variante. Für gewählte Gym-Alternativen gibt es keine eigene Anleitung.</li>
      </ul>
      <h4>Gym und Zuhause</h4>
      <ul>
        <li>Oben „Gym“ oder „Zuhause“ wählen. Zuhause laufen die Übungen an der KSK-Station unter eigenem Namen („KSK · …“).</li>
        <li>Die KSK-Multipresse startet bei 0 kg, die KSK-Züge laufen 1:1. Die App vergleicht deshalb nur mit Einheiten am selben Ort. Jede Übung immer am selben Gerät.</li>
        <li>Vorgabe: Montag, Dienstag und Samstag im Gym, Donnerstag und Freitag zuhause.</li>
      </ul>
      <h4>Gesundheit</h4>
      <ul>
        <li>Blutwerte vor dem Start, nach 6–8 Wochen, danach alle 3–4 Monate: Hämatokrit, Blutfette mit ApoB, Östradiol, Leber, Niere, HbA1c und Nüchternzucker, IGF-1. Blutdruck und Ruhepuls wöchentlich im Check-in. Dosierung nur mit ärztlicher Begleitung, die den ganzen Stack kennt.</li>
        <li>Testosteron erhöht das Risiko für Sehnenrisse im Oberkörper (Brust, Bizeps). Deshalb kontrolliert absenken, unten nicht abfedern, keine Maximalversuche und die Last in kleinen Schritten steigern.</li>
        <li>Tirzepatid: Der Appetit sinkt, die Abnahme wird schnell zu schnell. In Studien war rund ein Viertel des Gewichtsverlusts fettfreie Masse. Liegt das Tempo im Check-in über 1 % pro Woche: zuerst Kalorien und Eiweiß erhöhen, nicht den Trainingsumfang senken.</li>
        <li>CJC-1295 und Ipamorelin: vor allem mehr Wasser, keine belegte Kraftwirkung. Das verfälscht Waage und Körperfettmessung, deshalb Taille und Kraft mitbewerten. Ipamorelin steigert den Appetit, Tirzepatid senkt ihn. Blutzucker kontrollieren.</li>
        <li>KLOW (BPC-157, TB-500, GHK-Cu, KPV): keine Studien am Menschen zur Sehnenheilung, nicht zugelassen. Kein Grund, durch Schmerzen zu trainieren.</li>
      </ul>

 "Chest-Supported T-Bar Row": {s:["Brust fest ans Pad, Füße stabil auf den Trittflächen. Enger neutraler V-Griff.", "Arme unten ganz strecken, die Schulterblätter dürfen nach vorn gleiten (Dehnung).", "Ellbogen nah am Körper nach hinten ziehen, bis der Griff zu den unteren Rippen kommt.", "Kurz halten, dann in etwa 2 s ablassen. Die Brust bleibt am Pad."], f:"Brust vom Pad heben und mit dem Oberkörper ziehen, zu viel Gewicht mit halben Wiederholungen, Kopf überstrecken.", v:[["Jeff Nippard", "The Best And Worst Back Exercises (Ranked By Science)", "https://www.youtube.com/watch?v=jLvqKgW-_G8"]]},
 "Low-to-High Cable Fly": {s:["Beide Züge ganz unten, D-Griffe. Einen Schritt vor die Mitte, leicht versetzter Stand, Oberkörper aufrecht.", "Ellbogen leicht gebeugt und fixiert. Die Hände starten tief und seitlich neben dem Körper, die Brust ist gedehnt.", "In einem Bogen nach vorn-oben führen, bis die Hände auf Höhe von Kinn bzw. Schlüsselbein zusammenkommen.", "Langsam zurück in die Dehnung. Die Schulter bleibt unten und zentriert, die Dehnung nicht erzwingen."], f:"Ellbogenwinkel ändert sich (wird zum Drücken), Hände zu weit hinter den Körper, Schwung aus dem Rumpf.", v:[["TNF", "Say Goodbye to Flat Chests! Top 5 Chest Exercises You Should be Doing", "https://www.youtube.com/watch?v=ADfBvG03mlQ"]]},
 "1-Arm Kabel-Seitheben": {s:["Zug ganz unten, D-Griff in der vom Turm entfernten Hand. Das Kabel läuft vor dem Körper. Seitlich zum Turm stehen, mit der freien Hand festhalten.", "Der Arm startet leicht vor und quer vor dem Körper, so ist die Schulter schon unten unter Spannung.", "Den Arm in einem Bogen seitlich bis etwa Schulterhöhe heben. Der Ellbogen ist leicht gebeugt und führt.", "In etwa 2 s kontrolliert ablassen, unten nicht entlasten."], f:"Schwung aus Hüfte oder Oberkörper, Schulter zum Ohr ziehen, Arm deutlich über Schulterhöhe reißen.", v:[["Jeff Nippard", "Stop Messing Up Lateral Raises (Easy Fix)", "https://www.youtube.com/shorts/f_OGBg2KxgY"]]},
 "Reverse Pec Deck": {s:["Sitz so einstellen, dass die Griffe auf Schulterhöhe sind. Brust ans Pad, neutraler Griff (Daumen oben).", "Start mit fast gestreckten Armen vor dem Körper.", "Die Arme in einem weiten Bogen nach außen und hinten führen, bis sie etwa auf Höhe des Rumpfes sind. Der Ellbogenwinkel bleibt gleich.", "Langsam zurück, vorn nicht ganz entlasten."], f:"Mit Schwung arbeiten, Ellbogen beugen und rudern statt fliegen, zu schwer mit halben Wiederholungen.", q:"Renaissance Periodization reverse pec deck"},
 "Überkopf-Kabeltrizeps": {s:["Seil am hohen Zug. Rücken zum Turm, versetzter Stand, Oberkörper leicht nach vorn geneigt.", "Ellbogen neben dem Kopf. Die Oberarme zeigen schräg nach vorn-oben und bleiben ruhig.", "Die Unterarme hinter den Kopf sinken lassen, bis der Trizeps deutlich gedehnt ist, aber schmerzfrei.", "Aus den Ellbogen strecken, bis die Arme gerade sind. Rippen unten, kein Hohlkreuz."], f:"Ellbogen wandern weit auseinander oder nach vorn (wird zum Drücken), Hohlkreuz, Dehnung abkürzen.", q:"Renaissance Periodization overhead cable triceps extension"},
 "Bayesian Cable Curl": {s:["Zug ganz unten, D-Griff. Rücken zum Turm, einen großen Schritt nach vorn, versetzter Stand.", "Der Arm hängt leicht hinter dem Rumpf, nur so weit, wie es angenehm ist. Der Bizeps ist gedehnt.", "Hochcurlen, ohne dass der Oberarm nach vorn wandert. Oben kurz anspannen.", "Langsam ablassen, bis der Arm fast gestreckt ist."], f:"Ellbogen schiebt nach vorn (verkürzt die Dehnung), Oberkörper dreht mit, Schulter wird nach vorn gezogen.", v:[["Jeff Nippard", "Top 4 BICEPS Exercises (Brutal Stretch!)", "https://www.youtube.com/shorts/j5f_0rNkPwU"], ["Jeff Nippard", "The Best And Worst Biceps Exercises", "https://www.youtube.com/watch?v=GNO4OtYoCYk"]]},
 "Hack Squat": {s:["Rücken und Becken fest an die Lehne, Schulterpolster stabil. Füße mittig, schulterbreit, Zehen leicht nach außen. Sicherungen einstellen.", "Entriegeln und aufrecht starten, Rumpf angespannt.", "In 2–3 s absenken. Die Knie wandern nach vorn über die Zehen, so tief, wie das Becken an der Lehne bleibt.", "Über den ganzen Fuß hochdrücken, oben die Knie nicht durchdrücken."], f:"Unten abfedern, Becken rollt von der Lehne, Fersen heben ab, Knie fallen nach innen.", v:[["Jeff Nippard", "Before Your Next Leg Day… Watch This (5 Tips)", "https://www.youtube.com/shorts/FmNpOsEWms4"], ["Jeff Nippard", "The Best & Worst QUAD Exercises (Ranked Using Science)", "https://www.youtube.com/watch?v=kIXcoivzGf8"]]},
 "Beinpresse, Füße mittel/tief": {s:["Becken und unterer Rücken fest an der Lehne. Füße schulterbreit, mittig bis etwas tiefer auf der Platte.", "Gewicht entriegeln, Beine fast gestreckt.", "Kontrolliert absenken, bis die Knie tief gebeugt sind. Stoppen, bevor das Becken abrollt.", "Über den ganzen Fuß zurückdrücken. Die Knie zeigen in Richtung der Zehen."], f:"Becken hebt ab (Rundrücken unten), Fersen lösen sich, halbe Wiederholungen mit zu viel Gewicht, Knie oben durchdrücken.", q:"Renaissance Periodization leg press"},
 "Sitzender Beinbeuger": {s:["Kniegelenk auf Höhe der Drehachse. Oberschenkelpolster fest und tief, Fußpolster knapp über der Ferse.", "Aufrecht sitzen oder leicht nach vorn lehnen. Mehr Hüftbeugung dehnt die Beinbeuger stärker.", "Die Fersen kraftvoll nach unten-hinten ziehen, so weit es geht.", "Langsam zurück, bis das Knie fast gestreckt ist."], f:"Becken rutscht nach vorn, Oberschenkelpolster zu locker, das Gewicht zurückschnalzen lassen.", v:[["Jeff Nippard", "Grow Your Hamstrings 1.5x Faster (New Research)", "https://www.youtube.com/shorts/Lh3iMIcbkBQ"]]},
 "Beinstrecker, Lehne zurück": {s:["Lehne weit zurückstellen (Hüfte etwa 40°). Kniegelenk auf Höhe der Drehachse, Pad knapp über dem Sprunggelenk.", "Griffe festhalten, das Becken bleibt am Sitz.", "Beine kontrolliert strecken, oben kurz anspannen.", "In 2–3 s absenken, bis die Knie tief gebeugt sind."], f:"Gesäß hebt ab, Schwung aus der Hüfte, unten nur halb zurück.", v:[["Jeff Nippard", "How To Do Leg Extensions With Perfect Technique (Grow Every Quad Head)", "https://www.youtube.com/watch?v=ljO4jkwv8wQ"], ["Jeff Nippard", "A Better Way To Do Leg Extensions", "https://www.youtube.com/shorts/ztNBgrGy6FQ"]]},
 "Stehendes Wadenheben": {s:["Fußballen auf die Kante, Schulterpolster fest, Knie fast gestreckt.", "Fersen so tief wie möglich absenken und unten 1–2 s in der Dehnung halten.", "Über den großen Zeh auf die Zehenspitzen hochdrücken.", "Kontrolliert zurück in die tiefe Dehnung, nicht federn."], f:"Aus der Dehnung federn, Knie beugen und mit den Beinen drücken, nur kleine Bewegungen oben.", q:"Renaissance Periodization standing calf raise"},
 "Kabel-Crunch": {s:["Seil am hohen Zug, vor dem Turm knien, Seilenden neben dem Kopf.", "Die Hüfte bleibt ungefähr an Ort und Stelle.", "Die Rippen Richtung Becken einrollen, der Rücken wird rund.", "Langsam aufrollen, bis der Bauch gedehnt ist."], f:"Nur aus der Hüfte nach vorn kippen, mit den Armen ziehen, Schwung.", q:"Renaissance Periodization cable crunch"},
 "1-Arm Latzug zur Hüfte": {s:["D-Griff am hohen Zug, sitzend oder kniend, leicht schräg zum Turm.", "Oben den Arm ganz strecken und die Schulter mitgehen lassen: volle Lat-Dehnung, schmerzfrei.", "Den Ellbogen nach unten zur Körperseite bzw. Hüfte ziehen.", "Kontrolliert zurück in die Dehnung."], f:"Oberkörper dreht stark mit, mit dem Bizeps ziehen, oben die Dehnung abkürzen.", v:[["Jeff Nippard", "The Best And Worst Back Exercises (Ranked By Science)", "https://www.youtube.com/watch?v=jLvqKgW-_G8"]]},
 "Brustgestützte High Row": {s:["Brust ans Pad, Sitzhöhe so, dass die Griffe etwa auf Brusthöhe sind. Weiter pronierter Griff.", "Arme vorn strecken und die Schulterblätter nach vorn gleiten lassen.", "Die Ellbogen in etwa 45–60° nach hinten-außen ziehen, die Schulterblätter zusammenführen.", "Kontrolliert zurück in die Dehnung. Die Brust bleibt am Pad."], f:"Brust vom Pad, Ellbogen kleben am Körper (wird zur Lat-Übung), Schultern zu den Ohren ziehen.", q:"Renaissance Periodization chest supported high row"},
 "1-Arm Lat-Rudern zur Hüfte": {s:["D-Griff am tiefen bis mittleren Zug, Oberkörper leicht vorgebeugt, mit der freien Hand abstützen.", "Den Arm vorn strecken und die Schulter nach vorn dehnen lassen.", "Den Ellbogen nah am Körper in einem Bogen Richtung Hüfte ziehen.", "Langsam zurück in die Dehnung."], f:"Zur Brust ziehen (dann arbeitet der obere Rücken), mit dem Rumpf drehen, Schwung.", q:"Renaissance Periodization single arm cable row lats"},
 "Kabel-Pullover (Straight-Arm Pulldown)": {s:["Stange oder Seil am hohen Zug. Einen Schritt zurück, Hüfte leicht gebeugt, Oberkörper etwas vorgeneigt.", "Die Arme sind fast gestreckt und zeigen nach vorn-oben, die Lats sind gedehnt.", "Mit fixiertem Ellbogenwinkel in einem Bogen bis zu den Oberschenkeln ziehen. Rippen bleiben unten.", "Langsam zurück nach oben in die Dehnung."], f:"Ellbogen beugen (wird zum Trizepsdrücken), Hohlkreuz, mit dem Oberkörper wippen.", q:"Renaissance Periodization straight arm cable pulldown"},
 "Cable Preacher Curl": {s:["Preacher-Bank vor den tiefen Zug. Oberarme flach auf dem Pad, die Achseln am oberen Rand.", "Unten die Arme fast ganz strecken, schmerzfrei. Der Bizeps ist gedehnt.", "Die Stange hochcurlen, ohne dass die Oberarme vom Pad abheben.", "Langsam ablassen, unten nicht ruckartig umkehren."], f:"Unten aus der Dehnung reißen, Oberkörper zurücklehnen, Ellbogen vom Pad heben.", v:[["Jeff Nippard", "The Best And Worst Biceps Exercises", "https://www.youtube.com/watch?v=GNO4OtYoCYk"]]},
 "Rope Hammer Curl": {s:["Seil am tiefen Zug, neutraler Griff (Daumen oben), aufrecht stehen.", "Oberarme am Körper, die Arme unten fast gestreckt.", "Das Seil hochcurlen, die Ellbogen bleiben an der Seite.", "Kontrolliert ablassen."], f:"Hüftschwung, Ellbogen wandern nach vorn, Handgelenke abknicken.", v:[["Jeff Nippard", "The Best And Worst Biceps Exercises", "https://www.youtube.com/watch?v=GNO4OtYoCYk"]]},
 "Schrägbrust-Maschine 20–30°": {s:["Lehne 20–30°, Sitzhöhe so, dass die Griffe auf Höhe der oberen Brust sind. Einstellung notieren.", "Schulterblätter leicht zurück und unten, Rücken an der Lehne, Füße fest.", "In 2–3 s in die gedehnte Position zurück, ohne die Schultern nach vorn zu schieben.", "Nach vorn-oben drücken, bis die Arme fast gestreckt sind."], f:"Sitz zu tief oder zu hoch (Griffe auf Hals- oder Bauchhöhe), Schultern rollen nach vorn, Abfedern im Umkehrpunkt.", q:"Renaissance Periodization incline chest press machine"},
 "Konvergierende Brustpresse": {s:["Sitz so einstellen, dass die Griffe auf mittlerer Brusthöhe sind. Neutraler oder leicht pronierter Griff.", "Rücken an der Lehne, Schulterblätter stabil, Füße fest.", "Kontrolliert zurück, bis die Brust gut gedehnt ist. Nicht hart in den Anschlag.", "Nach vorn drücken, die Griffe laufen zusammen, die Arme sind am Ende fast gestreckt."], f:"Schultern lösen sich von der Lehne, harte Anschläge, nur kurze Bewegung.", q:"Renaissance Periodization machine chest press"},
 "Pec Deck": {s:["Sitzhöhe so, dass die Griffe auf Brusthöhe sind. Ellbogen leicht gebeugt und fixiert.", "Rücken an der Lehne, Brust leicht raus.", "Die Arme in einem Bogen vor der Brust zusammenführen, kurz anspannen.", "Langsam zurück in die Dehnung, ohne die Schultern nach vorn zu ziehen."], f:"Ellbogen beugen und drücken, Dehnung erzwingen, mit dem Oberkörper nach vorn gehen.", v:[["TNF", "Say Goodbye to Flat Chests! Top 5 Chest Exercises You Should be Doing", "https://www.youtube.com/watch?v=ADfBvG03mlQ"]]},
 "Seithebemaschine": {s:["Sitz so einstellen, dass die Schulter auf Höhe der Drehachse ist. Die Pads liegen an den Oberarmen.", "Aufrecht oder mit der Brust am Pad, je nach Gerät. Die Griffe nur locker halten.", "Die Arme über die Pads bis etwa Schulterhöhe nach außen führen.", "Kontrolliert absenken, unten nicht ablegen."], f:"Mit den Händen ziehen statt mit den Oberarmen drücken, Schultern hochziehen, Schwung.", q:"Renaissance Periodization lateral raise machine"},
 "Rope Pushdown": {s:["Seil am hohen Zug, aufrecht oder leicht vorgeneigt stehen.", "Oberarme am Rumpf fixiert. Start mit deutlich gebeugten Ellbogen.", "Das Seil nach unten strecken, am Ende leicht auseinanderziehen, kurz anspannen.", "Kontrolliert zurück, bis die Ellbogen wieder deutlich gebeugt sind."], f:"Ellbogen wandern nach vorn, der Oberkörper drückt mit, Schultern rollen nach vorn.", q:"Renaissance Periodization rope triceps pushdown"},
 "Ab Wheel": {s:["Kniend, Hände schulterbreit am Rad. Becken leicht einrollen, Gesäß anspannen.", "Die Rippen bleiben Richtung Becken gezogen.", "Langsam nach vorn rollen, nur so weit, wie der untere Rücken neutral bleibt.", "Mit dem Bauch zurückziehen, nicht zuerst mit der Hüfte."], f:"Hohlkreuz am Umkehrpunkt, zu weit rollen, Hüfte knickt beim Zurückrollen ein.", v:[["Jeff Nippard", "How To Build A Better Core & Six Pack Abs: Optimal Training Explained", "https://www.youtube.com/watch?v=1G0y8D5rFDc"]]},
 "Romanian Deadlift": {s:["Langhantel knapp schulterbreit, pronierter Griff. Hüftbreiter Stand, Knie leicht gebeugt.", "Rumpf anspannen, Rücken neutral, Schulterblätter leicht zurück.", "Die Hüfte nach hinten schieben, die Stange am Bein entlang absenken, bis die Beinbeuger stark gedehnt sind (meist knapp unter dem Knie).", "Die Hüfte nach vorn bringen und aufrichten, oben nicht überstrecken."], f:"Rundrücken, Stange entfernt sich vom Bein, Knie zu stark beugen (wird zur Kniebeuge), tiefer gehen als der Rücken neutral bleibt.", v:[["Jeff Nippard", "HOW TO DO ROMANIAN DEADLIFTS (RDLs): Build Beefy Hamstrings With Perfect Technique", "https://www.youtube.com/watch?v=_oyxCn2iSjU"]]},
 "Smith Split Squat": {s:["Stange auf dem oberen Rücken. Großer Schritt: vorderer Fuß vor, hinterer auf dem Ballen. Standlänge markieren, Anschläge einstellen.", "Das Gewicht liegt vor allem auf dem vorderen Fuß, Oberkörper leicht nach vorn geneigt.", "Gerade nach unten absenken, bis das hintere Knie knapp über dem Boden ist.", "Über den ganzen vorderen Fuß hochdrücken. Erst alle Wiederholungen einer Seite, dann wechseln."], f:"Stand zu kurz (Ferse hebt ab), vorderes Knie fällt nach innen, mit dem hinteren Bein drücken.", v:[["Jeff Nippard", "The Best & Worst QUAD Exercises (Ranked Using Science)", "https://www.youtube.com/watch?v=kIXcoivzGf8"]]},
 "Hip Adduction": {s:["Pads innen an den Knien. Startweite so wählen, dass eine angenehme Dehnung entsteht.", "Aufrecht sitzen, das Becken bleibt fest am Sitz.", "Die Beine kraftvoll zusammendrücken und kurz halten.", "Langsam zurück in die Dehnung."], f:"Aus der Dehnung federn, Becken kippt, eine zu weite Startposition erzwingen.", q:"Renaissance Periodization hip adduction machine"},
 "Hip Abduction": {s:["Pads außen an den Knien. Aufrecht sitzen oder leicht nach vorn lehnen, das betont das Gesäß stärker.", "Das Becken bleibt stabil am Sitz.", "Die Beine nach außen drücken und kurz halten.", "Kontrolliert zurück, nicht zusammenschlagen lassen."], f:"Mit dem Oberkörper wippen, nur kleine Bewegung mit zu viel Gewicht.", q:"Renaissance Periodization hip abduction machine"},
 "KSK · Kniender Latzug, neutral": {s:["Doppel-D-Griff oder zwei Einzelgriffe am hohen Zug, vor dem Turm knien.", "Oben die Arme ganz strecken und die Lats dehnen, nur minimale Rücklage.", "Die Ellbogen nach unten zur Hüfte ziehen.", "Kontrolliert zurück in die volle Streckung."], f:"Mit dem Oberkörper zurückwerfen, oben die Dehnung abkürzen.", v:[["Jeff Nippard", "The Best And Worst Back Exercises (Ranked By Science)", "https://www.youtube.com/watch?v=jLvqKgW-_G8"]]},
 "KSK · Sitzendes Kabelrudern, V-Griff": {s:["V-Griff am tiefen Zug. Sitzen, Füße am Rahmen abstützen, Knie leicht gebeugt.", "Vorn die Arme strecken und die Schulterblätter nach vorn gleiten lassen. Der Oberkörper bleibt aufrecht.", "Die Ellbogen nah am Körper nach hinten ziehen, der Griff kommt zu den unteren Rippen.", "Kontrolliert zurück in die Dehnung."], f:"Mit dem Oberkörper pendeln, Schultern hochziehen.", q:"Renaissance Periodization seated cable row"},
 "KSK · Kabel-Reverse-Fly über Kreuz": {s:["Beide hohen Züge auf Schulterhöhe. Kabel kreuzen: Die linke Hand greift den rechten Zug und umgekehrt.", "Aufrecht stehen, die Arme sind vor dem Körper fast gestreckt.", "Die Arme in einem weiten Bogen nach außen und hinten führen.", "Langsam zurück, bis sich die Hände vor dem Körper kreuzen."], f:"Ellbogen beugen und rudern, Schwung, Oberkörper lehnt sich zurück.", q:"Renaissance Periodization cable reverse fly"},
 "KSK · Smith Squat, Füße leicht vorne": {s:["Stange auf dem oberen Rücken, Füße etwas vor dem Körper und schulterbreit. Anschläge einstellen, die KSK-Stange startet bei 0 kg.", "Rumpf anspannen, Stange entriegeln.", "Absenken, die Knie wandern nach vorn, so tief, wie das Becken kontrolliert bleibt.", "Über den ganzen Fuß hochdrücken."], f:"Füße zu weit vorn, Fersen heben ab, unten abfedern.", q:"Renaissance Periodization smith machine squat"},
 "KSK · Smith Squat, Fersen erhöht": {s:["Fersen auf eine Erhöhung (z. B. Hantelscheibe), enger Stand, Füße unter der Stange.", "Oberkörper aufrecht, Rumpf fest.", "Tief absenken, die Knie wandern weit nach vorn. Das betont die Quads.", "Über den ganzen Fuß hochdrücken."], f:"Becken rollt unten ab, Knie fallen nach innen, abfedern.", q:"Renaissance Periodization heels elevated smith squat"},
 "KSK · Einbeiniger Kabel-Beinbeuger stehend": {s:["Manschette am Knöchel, tiefer Zug, Gesicht zum Turm. Mit den Händen festhalten.", "Den Oberschenkel des Arbeitsbeins leicht vor dem Körper fixieren, die Hüfte bleibt stabil.", "Die Ferse Richtung Gesäß ziehen.", "Langsam zurück, bis das Knie fast gestreckt ist."], f:"Oberschenkel wandert nach hinten (Hüfte arbeitet statt Knie), Schwung, Hohlkreuz.", q:"Renaissance Periodization standing cable leg curl"},
 "KSK · Einbeiniger Kabel-Beinstrecker, zurückgelehnt": {s:["Bank vor den tiefen Zug, mit dem Rücken zum Turm sitzen, Manschette am Knöchel. Oberkörper zurücklehnen.", "Der Oberschenkel bleibt auf der Bank, das Becken am Sitz.", "Das Bein strecken, oben kurz anspannen.", "Langsam zurück in eine tiefe Kniebeugung."], f:"Hüfte hebt ab, Schwung, unten nicht tief genug.", v:[["Jeff Nippard", "A Better Way To Do Leg Extensions", "https://www.youtube.com/shorts/ztNBgrGy6FQ"]]},
 "KSK · Smith Wadenheben stehend": {s:["Fußballen auf eine stabile Erhöhung unter der Stange, Stange auf dem oberen Rücken, Knie fast gestreckt.", "Fersen tief absenken und 1–2 s in der Dehnung halten.", "Auf die Zehenspitzen hochdrücken.", "Kontrolliert zurück, nicht federn."], f:"Federn, Knie beugen, die Erhöhung rutscht. Vorher sicher hinstellen.", q:"Renaissance Periodization smith machine calf raise"},
 "KSK · Seated Cable Row, Ellbogen außen": {s:["Weite gerade Stange am tiefen Zug, pronierter Griff. Sitzen, Füße am Rahmen.", "Vorn die Schulterblätter kontrolliert nach vorn dehnen, der Oberkörper bleibt aufrecht und ruhig.", "Die Ellbogen in etwa 45–60° nach außen-hinten ziehen, die Stange kommt zur oberen Brust.", "Langsam zurück in die Dehnung."], f:"Mit dem Oberkörper pendeln, Ellbogen am Körper (wird zum Lat-Rudern).", q:"Renaissance Periodization wide grip seated cable row"},
 "KSK · Kabel-Curl an der Schrägbanklehne": {s:["Schrägbank vor den tiefen Zug. Hinter die Lehne stellen oder knien, die Oberarme liegen auf der Lehne (Preacher-Ersatz).", "Unten die Arme fast strecken, schmerzfrei.", "Hochcurlen, die Oberarme bleiben auf der Lehne.", "Langsam ablassen."], f:"Unten reißen, Oberarme heben ab.", v:[["Jeff Nippard", "The Best And Worst Biceps Exercises", "https://www.youtube.com/watch?v=GNO4OtYoCYk"]]},
 "KSK · Smith-Flachbank": {s:["Flachbank so unter die Stange, dass sie über der unteren Brust landet. Anschläge einstellen, die Stange startet bei 0 kg.", "Schulterblätter zurück und unten fixieren, Füße fest.", "In 2–3 s zur unteren Brust absenken, Ellbogen etwa 45–70° vom Körper.", "Ohne Abfedern hochdrücken."], f:"Abfedern, Ellbogen 90° seitlich abgespreizt, Gesäß hebt ab.", v:[["TNF", "Say Goodbye to Flat Chests! Top 5 Chest Exercises You Should be Doing", "https://www.youtube.com/watch?v=ADfBvG03mlQ"]]},

/* ---------- Speicher ----------
   Läuft in zwei Umgebungen: innerhalb von Claude über window.storage,
   selbst gehostet über den Browser-Speicher. Eigener Schlüssel: die Daten
   von V6 und V8 bleiben unberührt. */
let backend = "none";

/* Ohne Frist bleibt die App stehen, wenn die Speicherbruecke nie antwortet
   (z. B. im oeffentlich geteilten Artifact). Daher jeder Aufruf mit Timeout. */
const guard = (p, ms = 1500) => Promise.race([
  Promise.resolve(p),
  new Promise((_, rej) => setTimeout(() => rej(new Error("storage timeout")), ms))
]);

function normalize(){
  if(!store.sets) store.sets = {};
  if(!store.var)  store.var  = {};
  if(!store.loc)  store.loc  = {};
  if(!store.mode) store.mode = {};
  if(!store.checkin) store.checkin = {};
  if(!store.meta) store.meta = {week:1, day:0};
  if(!store.settings) store.settings = {};
  if(!store.since) store.since = {};
  /* Getauschte Übungen (ex.was): ab der Woche nach dem letzten Eintrag an
     diesem Platz gilt die neue Übung, davor bleibt der alte Name. */
  DAYS.forEach((D, d)=> D.ex.forEach((ex, e)=>{
    const k = `d${d}|e${e}`;
    if(!ex.was || store.since[k]) return;
    let last = 0;
    Object.keys(store.sets).forEach(key =>{
      const m = key.match(/^w(\d+)\|d(\d+)\|e(\d+)\|/);
      if(m && +m[2] === d && +m[3] === e) last = Math.max(last, +m[1]);
    });
    store.since[k] = last + 1;
  }));
  store.plan = PLAN;
}

async function load(){
  if(typeof window.storage !== "undefined" && window.storage){
    try{
      const r = await guard(window.storage.get(KEY));
      backend = "claude";
      if(r && r.value) store = JSON.parse(r.value);
    }catch(e){
      try{ await guard(window.storage.set(KEY, JSON.stringify(store))); backend = "claude"; }
      catch(e2){ /* weiter zum Browser-Speicher */ }
    }
  }
  if(backend === "none"){
    try{
      localStorage.setItem(KEY + "_probe", "1");
      localStorage.removeItem(KEY + "_probe");
      backend = "local";
      const raw = localStorage.getItem(KEY);
      if(raw) store = JSON.parse(raw);
    }catch(e){
      memoryOnly = true;
      document.getElementById("warn").classList.add("on");
    }
  }
  normalize();
}

let saveT = null;
function save(){
  if(memoryOnly) return;
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    const json = JSON.stringify(store);
    try{
      if(backend === "claude") await guard(window.storage.set(KEY, json), 3000);
      else localStorage.setItem(KEY, json);
    }catch(e){
      try{ localStorage.setItem(KEY, json); backend = "local"; }
      catch(e2){
        memoryOnly = true;
        document.getElementById("warn").classList.add("on");
      }
    }
  }, 420);
}

const id = (w,d,e,s)=>`w${w}|d${d}|e${e}|s${s}`;
const get = (w,d,e,s)=> store.sets[id(w,d,e,s)] || null;

/* ---------- Modus pro Woche: Standard, Reduziert, Deload ---------- */
const modeOf = w => (store.mode && store.mode[w]) || "std";
function setsIn(ex, m){
  if(m === "red" && ex.t === "iso") return Math.max(1, ex.s - 1);
  if(m === "deload") return Math.ceil(ex.s / 2);
  return ex.s;
}
const setsFor = ex => setsIn(ex, modeOf(store.meta.week));
const totalSets = m => DAYS.reduce((a, D)=> a + D.ex.reduce((b, ex)=> b + setsIn(ex, m), 0), 0);

/* ---------- Ort pro Woche/Tag und gewählte Variante ---------- */
const lid = (w,d)=>`w${w}|d${d}`;
const locOf = (w,d)=> (store.loc && store.loc[lid(w,d)]) || DAYS[d].loc;
const vid = (w,d,e)=>`w${w}|d${d}|e${e}`;
const variant = (w,d,e)=> (store.var && store.var[vid(w,d,e)]) || null;

/* Vor dem Tausch (store.since) gilt an diesem Platz die alte Übung. */
function baseOf(w,d,e){
  const ex = DAYS[d].ex[e];
  return ex.was && w < ((store.since && store.since[`d${d}|e${e}`]) || 1) ? ex.was : ex;
}

/* Zuhause gilt immer die KSK-Variante, Alternativen gibt es nur im Gym. */
function nameOf(w,d,e){
  const ex = baseOf(w,d,e);
  if(locOf(w,d) === "home") return ex.h || `KSK · ${ex.n}`;
  return variant(w,d,e) || ex.n;
}
function gripOf(w,d,e){
  const ex = baseOf(w,d,e);
  if(locOf(w,d) === "home") return ex.hg || (ex.g ? `${ex.g} · KSK-Zug 1:1` : "");
  return variant(w,d,e) ? "" : (ex.g || "");
}

/* letzte Woche mit Daten für denselben Satz an derselben Übung (gleicher Name);
   außerhalb eines Deloads zählen Deload-Wochen nicht als Vorwert */
function ghost(w,d,e,s){
  const name = nameOf(w,d,e);
  const skipDeload = modeOf(w) !== "deload";
  for(let k=w-1;k>=1;k--){
    if(nameOf(k,d,e) !== name || (skipDeload && modeOf(k) === "deload")) continue;
    const v = get(k,d,e,s);
    if(v && v.r) return {w:k, ...v};
  }
  return null;
}

/* Einheiten derselben Übung mit Satz 1, neueste zuerst; Deload-Wochen zählen nicht. */
function sessions(d, e){
  const w = store.meta.week, name = nameOf(w,d,e), out = [];
  for(let k=w;k>=1;k--){
    if(modeOf(k) === "deload" || nameOf(k,d,e) !== name) continue;
    const v = get(k,d,e,1);
    if(v && v.r) out.push({w:k, l: v.l === "" || v.l == null ? null : +v.l, r:+v.r});
  }
  return out;
}

/* ---------- Stillstand: 3 Einheiten gleiche Last und gleiche Wdh. ---------- */
function stalled(d, e){
  const s = sessions(d, e).slice(0, 3);
  if(s.length < 3) return null;
  const [a,b,c] = s;
  if(a.l === b.l && b.l === c.l && a.r === b.r && b.r === c.r)
    return `${a.l ?? "–"} kg × ${a.r} in Wo. ${c.w}, ${b.w} und ${a.w}`;
  return null;
}

/* ---------- Cut-Check: Leitübung zwei Einheiten > 5 % unter dem Bestwert davor ---------- */
const e1rm = x => x.l * (1 + x.r / 30);
function cutDrop(d, e){
  const s = sessions(d, e).filter(x => x.l > 0);
  if(s.length < 3) return null;
  const [a, b, ...rest] = s;
  const base = Math.max(...rest.slice(0, 4).map(e1rm));
  if(e1rm(a) < base * 0.95 && e1rm(b) < base * 0.95)
    return `Wo. ${b.w} und ${a.w} mehr als 5 % unter dem Bestwert davor`;
  return null;
}

/* ---------- Wöchentlicher Check-in: Abnahmetempo ---------- */
const ciOf = w => (store.checkin && store.checkin[w]) || null;
const numOf = v => (v === "" || v == null || isNaN(+v) ? null : +v);
const de = x => String(x).replace(".", ",");
/* Veränderung pro Woche gegenüber dem letzten Check-in mit Gewicht; positiv = Abnahme */
function lossRate(w){
  const cur = ciOf(w);
  if(!cur || numOf(cur.bw) == null) return null;
  for(let k=w-1;k>=1;k--){
    const prev = ciOf(k);
    if(prev && numOf(prev.bw) != null)
      return {pct: (numOf(prev.bw) - numOf(cur.bw)) / numOf(prev.bw) * 100 / (w - k), from:k};
  }
  return null;
}
const fmtRate = x => `${x >= 0 ? "−" : "+"}${de(Math.abs(x).toFixed(1))} %/Wo`;
function rateHint(w){
  const r = lossRate(w);
  if(!r) return "kein Gewichtsverlauf im Check-in: zuerst Abnahmetempo prüfen";
  if(r.pct > 1) return `Abnahme ${fmtRate(r.pct)} ist zu schnell: zuerst Kalorien und Eiweiß erhöhen, Umfang halten`;
  return "Tempo ok: Schlaf, Pausen und Essen prüfen; bleibt es so, Modus „Reduziert“";
}

/* ---------- Urteil pro Übung ---------- */
function verdict(ex, d, ei, n){
  const w = store.meta.week;
  const vals = [];
  for(let s=1;s<=n;s++){
    const v = get(w,d,ei,s);
    if(!v || !v.r) return {k:"hold", txt:"Noch nicht vollständig geloggt", sub:""};
    vals.push(v);
  }
  if(modeOf(w) === "deload") return {k:"hold", txt:"Deload – Last halten", sub:"RIR 3, nicht steigern"};
  const below = vals.filter(v=>v.r < ex.lo).length;
  if(below) return {k:"down", txt:"Last eine Stufe zurück", sub:`${below} Satz/Sätze unter ${ex.lo} Wdh.`};

  const iso = ex.t === "iso";
  const ok = iso ? vals.every(v=>v.r >= ex.hi)
                 : (vals[0].r >= ex.hi && vals.every(v=>v.r >= ex.lo));
  if(ok){
    const step = (ex.t === "schwer") ? "+1,25–2,5 kg"
               : (ex.t === "maschine") ? "+1 Stufe" : "+1–2 kg";
    return {k:"up", txt:"Nächstes Mal Last erhöhen", sub:step};
  }
  return {k:"hold", txt:"Im Bereich – Last halten",
          sub: iso ? `alle Sätze auf ${ex.hi}` : `Satz 1 auf ${ex.hi}`};
}

};

const MUSCLE_ORDER = ["Brust", "Lats", "Bizeps", "Trizeps", "Schulter seitlich", "Schulter hinten", "Oberer Rücken",
                      "Quadrizeps", "Beinbeuger", "Waden", "Bauch", "Hüfte"];

/* ---------- Einstellungen ---------- */
const DEF_SET = {autoRest:true, sound:false, vibrate:true, wake:true};
const setting = k => (store.settings && typeof store.settings[k] === "boolean") ? store.settings[k] : DEF_SET[k];
function setSetting(k, v){ if(!store.settings) store.settings = {}; store.settings[k] = v; save(); }

/* ---------- Zählen ---------- */
const numv = v => (v === "" || v == null || isNaN(+v) ? null : +v);
function dayCount(w, d){
  let due = 0, done = 0;
  DAYS[d].ex.forEach((ex, e)=>{
    const n = setsIn(ex, modeOf(w)); due += n;
    for(let s=1;s<=n;s++){ const v = get(w,d,e,s); if(v && v.r) done++; }
  });
  return {due, done};
}
function weekCount(w){
  return DAYS.reduce((a, _, d)=>{ const c = dayCount(w, d); return {due:a.due + c.due, done:a.done + c.done}; }, {due:0, done:0});
}
/* Volumen = Last × Wiederholungen über alle geloggten Sätze (auch über der heutigen Satzzahl) */
function volumeOf(w, d){
  let v = 0;
  for(const dd of (d == null ? DAYS.map((_, i)=> i) : [d]))
    DAYS[dd].ex.forEach((ex, e)=>{
      for(let s=1; s<=ex.s || get(w,dd,e,s); s++){ const r = get(w,dd,e,s); if(r && r.r > 0 && r.l > 0) v += r.l * r.r; }
    });
  return v;
}
function estMinutes(d){
  const m = modeOf(store.meta.week); let sec = 0;
  DAYS[d].ex.forEach(ex =>{
    const n = setsIn(ex, m); if(!n) return;
    const wu = ex.wu === "3" ? 3 : ex.wu === "2" ? 2 : 1;
    sec += n * (ex.rest + 45) + wu * 75 + 60;
  });
  return Math.round(sec / 300) * 5;
}
const weekHasData = w => Object.keys(store.sets).some(k => k.startsWith(`w${w}|`));
const weekHasToday = w =>{ const t = todayKey(); return Object.entries(store.sets).some(([k, v]) => k.startsWith(`w${w}|`) && v && v.t && dateKey(v.t) === t); };
function suggestNextWeek(){
  const w = store.meta.week;
  return new Date().getDay() === 1 && w < WEEKS && store.meta.noSuggest !== todayKey()
      && weekHasData(w) && !weekHasData(w + 1) && !weekHasToday(w);
}
function nextTrainingDay(dow){
  for(let i=1;i<=7;i++){ const d = DOW_DAY[(dow + i) % 7]; if(d != null) return d; }
  return 0;
}

/* ---------- Verlauf und Rekorde (geschätztes Maximum, Epley) ----------
   Pro Übungsname und Woche der beste Satz; Deload-Wochen zählen nicht. Gleiche
   Übung an mehreren Tagen (z. B. Überkopf-Trizeps) läuft in einem Verlauf. */
function historyIndex(){
  const H = new Map();
  for(const [key, v] of Object.entries(store.sets)){
    if(!v || !(v.l > 0) || !(v.r > 0)) continue;
    const m = key.match(/^w(\d+)\|d(\d+)\|e(\d+)\|s(\d+)$/); if(!m) continue;
    const w = +m[1], d = +m[2], e = +m[3];
    if(!DAYS[d] || !DAYS[d].ex[e] || modeOf(w) === "deload") continue;
    const name = nameOf(w, d, e), est = e1rm(v);
    let W = H.get(name);
    if(!W){ W = new Map(); W.first = {d, e}; H.set(name, W); }
    if(d < W.first.d || (d === W.first.d && e < W.first.e)) W.first = {d, e};
    const cur = W.get(w);
    if(!cur || est > cur.e) W.set(w, {e:est, l:v.l, r:v.r, d, s:+m[4]});
  }
  return H;
}
function bestBefore(W, w){ let b = 0; if(W) for(const [k, x] of W) if(k < w && x.e > b) b = x.e; return b; }
function isPR(H, name, w){ const W = H.get(name); if(!W || !W.has(w)) return false; const b = bestBefore(W, w); return b > 0 && W.get(w).e > b; }

/* ---------- Aufwärmen in kg aus dem Arbeitsgewicht (Satz 1, sonst Vorwert) ---------- */
const WU_PCT = {"3":[[.45, "8–10"], [.675, "4–5"], [.825, "1–3"]], "2":[[.55, "6–8"], [.775, "3–4"]], "1":[[.55, "6–8"]], "0–1":[[.55, "6–8"]]};
function warmupLine(ex, w, d, e){
  if(ex.wut) return ex.wut;
  const cur = get(w,d,e,1), g = ghost(w,d,e,1), W = numv(cur && cur.l) || numv(g && g.l);
  if(!W || !WU_PCT[ex.wu]) return WU[ex.wu];
  const step = W >= 30 ? 2.5 : 1;
  const parts = WU_PCT[ex.wu].map(([p, reps]) => `${kg(Math.round(W * p / step) * step)} × ${reps}`);
  return `${ex.wu === "0–1" ? "nur wenn du nicht warm bist: " : ""}${parts.join(" · ")} kg (von ${kg(W)} kg)`;
}

/* Satz speichern, ohne die Karte neu zu zeichnen (Fokus bleibt im Feld) */
function parseIn(x, int){
  x = String(x).trim().replace(",", ".");
  if(x === "") return "";
  const v = int ? parseInt(x, 10) : parseFloat(x);
  return isNaN(v) ? "" : v;
}
function commitRow(row){
  const {week, day} = store.meta, ei = +row.closest(".ex").dataset.e, s = +row.dataset.s;
  const [li, ri, ii] = $$(".in", row);
  const rec = {l:parseIn(li.value), r:parseIn(ri.value, true), rir:parseIn(ii.value, true)};
  const k = id(week, day, ei, s), prev = store.sets[k] ? {...store.sets[k]} : null;
  if(rec.l === "" && rec.r === "" && rec.rir === "") delete store.sets[k];
  else { rec.t = (prev && prev.t) || Date.now(); store.sets[k] = rec; }
  save();
  return {ei, s, rec, prev};
}
function rowState(row){
  const {week, day} = store.meta, ei = +row.closest(".ex").dataset.e, s = +row.dataset.s;
  const ex = DAYS[day].ex[ei], cur = get(week, day, ei, s) || {}, g = ghost(week, day, ei, s);
  const r = numv(cur.r), l = numv(cur.l);
  const gl = numv(g && g.l) ?? 0, gr = numv(g && g.r);
  row.classList.toggle("done", r != null);
  row.classList.toggle("go", r != null && r >= ex.hi);
  row.classList.toggle("under", r != null && r < ex.lo);
  row.classList.toggle("beat", r != null && gr != null && ((r > gr && (l ?? 0) >= gl) || ((l ?? 0) > gl && r >= gr)));
}
function liveMark(inp){
  const row = inp.closest(".set"), ex = DAYS[store.meta.day].ex[+row.closest(".ex").dataset.e];
  const r = parseIn($(".in[data-f=r]", row).value, true);
  row.classList.toggle("go", r !== "" && r >= ex.hi);
  row.classList.toggle("under", r !== "" && r < ex.lo);
}
const prShown = new Set();
function afterCommit(ei, rec){
  const {week, day} = store.meta, ex = DAYS[day].ex[ei], card = $(`#ex-${ei}`);
  const n = setsIn(ex, modeOf(week));
  let done = 0; for(let s=1;s<=n;s++){ const v = get(week, day, ei, s); if(v && v.r) done++; }
  const was = card.classList.contains("complete"), complete = done >= n;
  card.classList.toggle("complete", complete);
  $(".ex-num", card).innerHTML = complete ? icon("check", "sm") : pad2(ei + 1);
  $(".ex-foot", card).innerHTML = footHtml(ex, ei);
  /* Rekord: bester Satz dieser Woche über allen früheren Wochen */
  const H = historyIndex(), name = nameOf(week, day, ei), pr = isPR(H, name, week);
  const tags = $(".tags", card), prTag = $(".tag.pr", card);
  if(pr && !prTag){
    const t = `<span class="tag pr">${icon("trophy", "xs")}Rekord</span>`;
    if(tags) tags.insertAdjacentHTML("beforeend", t); else $(".ex-t h3", card).insertAdjacentHTML("beforeend", `<span class="tags">${t}</span>`);
  } else if(!pr && prTag) prTag.remove();
  if(pr && rec && rec.l > 0 && rec.r > 0){
    const W = H.get(name), best = W.get(week), key = `${name}|${week}|${best.e.toFixed(1)}`;
    if(Math.abs(e1rm(rec) - best.e) < 1e-6 && !prShown.has(key)){
      prShown.add(key);
      toast(`${icon("trophy", "sm")}<span>Neuer Rekord · ${kg(rec.l)} kg × ${rec.r}</span>`, "pr");
    }
  }
  /* Zähler oben aktualisieren */
  const c = dayCount(week, day), vol = volumeOf(week, day);
  const st = $("#st-sets"), sv = $("#st-vol"), se = $("#st-end");
  if(st) st.innerHTML = `<b>${c.done}/${c.due}</b> Sätze`;
  if(sv) sv.innerHTML = `<b>${fmt0(vol)}</b> kg Volumen`;
  if(se) se.textContent = `${c.done}/${c.due} Sätze · ${fmt0(vol)} kg Volumen`;
  renderTrainHeader();
  return {was, complete};
}
function onInputCommit(inp){
  const row = inp.closest(".set"), {ei, rec, prev} = commitRow(row);
  rowState(row);
  if(inp.dataset.f === "r" && rec.r !== "" && (!prev || prev.r !== rec.r) && setting("autoRest")) startRest(ei);
  afterCommit(ei, rec);
}
function onCheck(row){
  unlockAudio();
  const {week, day} = store.meta, ei = +row.closest(".ex").dataset.e, s = +row.dataset.s;
  const [li, ri, ii] = $$(".in", row);
  if(ri.value.trim() === ""){
    const g = ghost(week, day, ei, s);
    if(!(g && g.r)){
      row.classList.add("shake"); setTimeout(()=> row.classList.remove("shake"), 400);
      ri.focus(); toast("Erst die Wiederholungen eintragen");
      return;
    }
    if(li.value.trim() === "" && numv(g.l) != null) li.value = String(g.l).replace(".", ",");
    ri.value = g.r;
    if(ii.value.trim() === "" && g.rir !== "" && g.rir != null) ii.value = g.rir;
  }
  const {rec} = commitRow(row);
  rowState(row);
  haptic();
  if(setting("autoRest")) startRest(ei);
  const {was, complete} = afterCommit(ei, rec);
  /* Übung fertig: zur nächsten Karte springen */
  if(complete && !was){
    const next = $(`#ex-${ei}`).nextElementSibling;
    if(next) setTimeout(()=> next.scrollIntoView({behavior:"smooth", block:"start"}), 380);
  }
}

}

function ciRateText(w){
  const r = lossRate(w);
  if(!r) return "Noch kein Vergleich. Trag nächste Woche wieder ein, dann zeigt die App das Abnahmetempo.";
  const txt = `Veränderung seit Wo. ${r.from}: ${fmtRate(r.pct)}. Ziel im Cut: 0,5–1 % pro Woche.`;
  return r.pct > 1 ? `${txt} Zu schnell: zuerst Kalorien und Eiweiß erhöhen, den Trainingsumfang halten.`
       : r.pct < 0.3 ? `${txt} Langsam: Taille und Kraft prüfen; Wasser durch die GH-Peptide kann die Waage verfälschen.`
       : `${txt} Im Zielbereich.`;
}
function openCheckin(){

function latestCheckin(){

function muscleRows(w){
  const plan = {}, done = {}, m = modeOf(w);
  DAYS.forEach((D, d)=> D.ex.forEach((ex, e)=>{
    const n = setsIn(ex, m), mus = muscleOf(w, d, e);
    plan[mus] = (plan[mus] || 0) + n;
    for(let s=1;s<=n;s++){ const v = get(w,d,e,s); if(v && v.r) done[mus] = (done[mus] || 0) + 1; }
  }));
  return MUSCLE_ORDER.filter(k => plan[k]).map(k =>{
    const p = plan[k], dn = done[k] || 0;
    return `<div class="mrow"><span class="ml">${PRIO.has(k) ? icon("star", "xs") : ""}${escH(k)}</span>
      <span class="mtrack" role="meter" aria-label="${escH(k)}: ${dn} von ${p} Sätzen" aria-valuemin="0" aria-valuemax="${p}" aria-valuenow="${dn}"><i style="width:${Math.min(100, dn / p * 100)}%"></i></span>
      <span class="mv">${dn}/${p}</span></div>`;
  }).join("");
}
function exerciseNames(H){
  return [...H.keys()].sort((a, b)=>{
    const A = H.get(a).first, B = H.get(b).first;
    return A.d - B.d || A.e - B.e || a.localeCompare(b, "de");

}
function pickDefault(H){
  const names = exerciseNames(H);

/* ---------- Liniendiagramm (eine Reihe, SVG, mit Fadenkreuz) ----------
   2px Linie, Fläche 10 %, Endpunkt mit Ring und Wert, Haarlinien-Raster,
   Tooltip per Zeiger, Antippen und Pfeiltasten; Tabelle als Alternative. */
function niceTicks(lo, hi, n){
  const raw = (hi - lo) / Math.max(1, n - 1), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const out = []; for(let t = Math.floor(lo / step) * step; t <= hi + step * 1e-6; t += step) out.push(+t.toFixed(6));
  if(out[out.length - 1] < hi) out.push(+(out[out.length - 1] + step).toFixed(6));
  return out;
}
function lineChart(host, pts, {h = 180, unit = "", label = ""} = {}){
  if(!host) return;
  const Wd = Math.max(240, Math.round(host.clientWidth || 300)), Ht = h, pl = 42, pr = 58, pt = 14, pb = 26;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if(x0 === x1){ x0 -= 1; x1 += 1; }
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const span = (y1 - y0) || Math.max(1, Math.abs(y1) * 0.04);
  const ticks = niceTicks(y0 - span * 0.2, y1 + span * 0.2, 4);
  y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const X = x => pl + (x - x0) / (x1 - x0) * (Wd - pl - pr);
  const Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (Ht - pt - pb);
  const base = Ht - pb, last = pts[pts.length - 1];
  const line = pts.map((p, i)=> `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const every = pts.length > 8 ? Math.ceil(pts.length / 6) : 1;
  let s = `<svg viewBox="0 0 ${Wd} ${Ht}" width="${Wd}" height="${Ht}" role="img" aria-label="${escH(label)}: ${pts.length} Werte, zuletzt ${fmt1(last.y)} ${unit}">`;
  ticks.forEach(t =>{ s += `<line class="grid" x1="${pl}" x2="${Wd - pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="ytk" x="${pl - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmt1(t)}</text>`; });
  s += `<line class="axis" x1="${pl}" x2="${Wd - pr}" y1="${base}" y2="${base}"/>`;
  pts.forEach((p, i)=>{ if(i % every === 0 || i === pts.length - 1) s += `<text class="xtk" x="${X(p.x).toFixed(1)}" y="${Ht - 7}" text-anchor="middle">W${p.x}</text>`; });
  if(pts.length > 1) s += `<path class="area" d="${line}L${X(last.x).toFixed(1)},${base}L${X(pts[0].x).toFixed(1)},${base}Z"/><path class="line" d="${line}"/>`;
  s += `<circle class="dot" cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4.5"/>`;
  s += `<text class="endl" x="${(X(last.x) + 10).toFixed(1)}" y="${(Y(last.y) + 4).toFixed(1)}">${fmt1(last.y)}</text>`;
  s += `<line class="xh" x1="0" x2="0" y1="${pt}" y2="${base}" style="display:none"/><circle class="xd" r="4.5" style="display:none"/>`;
  s += `<rect class="hit" x="0" y="0" width="${Wd}" height="${Ht}" fill="transparent"/></svg><div class="tt" hidden></div>`;
  host.innerHTML = s;
  const svg = $("svg", host), tt = $(".tt", host), xh = $(".xh", svg), xd = $(".xd", svg), hit = $(".hit", svg);
  let ki = pts.length - 1;
  const show = i =>{
    ki = i; const p = pts[i], sx = svg.clientWidth / Wd, sy = svg.clientHeight / Ht;
    xh.setAttribute("x1", X(p.x)); xh.setAttribute("x2", X(p.x)); xh.style.display = "";
    xd.setAttribute("cx", X(p.x)); xd.setAttribute("cy", Y(p.y)); xd.style.display = "";
    tt.textContent = "";
    const b = document.createElement("b"); b.textContent = `${fmt1(p.y)} ${unit}`.trim();
    const sp = document.createElement("span"); sp.textContent = `Woche ${p.x}${p.info ? " · " + p.info : ""}`;
    tt.append(b, sp); tt.hidden = false;
    const left = X(p.x) * sx, half = tt.offsetWidth / 2 + 4;
    tt.style.left = `${Math.min(Math.max(left, half), host.clientWidth - half)}px`;
    tt.style.top = `${Math.max(Y(p.y) * sy - 12, tt.offsetHeight)}px`;
  };
  const hide = ()=>{ xh.style.display = "none"; xd.style.display = "none"; tt.hidden = true; };
  const nearest = cx =>{
    const r = svg.getBoundingClientRect(), vx = (cx - r.left) / r.width * Wd;
    let bi = 0, bd = Infinity; pts.forEach((p, i)=>{ const d = Math.abs(X(p.x) - vx); if(d < bd){ bd = d; bi = i; } });
    return bi;
  };
  hit.addEventListener("pointermove", e => show(nearest(e.clientX)));
  hit.addEventListener("pointerdown", e => show(nearest(e.clientX)));
  hit.addEventListener("pointerleave", e =>{ if(e.pointerType === "mouse") hide(); });
  svg.setAttribute("tabindex", "0");
  svg.addEventListener("focus", ()=> show(ki));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", e =>{
    if(e.key === "ArrowLeft"){ show(Math.max(0, ki - 1)); e.preventDefault(); }
    else if(e.key === "ArrowRight"){ show(Math.min(pts.length - 1, ki + 1)); e.preventDefault(); }
    else if(e.key === "Escape") hide();
  });
}

  [...$("#tpl-rules").content.children].forEach(el =>{

    else if(el.tagName === "UL" && title){
      out.push(`<details class="acc"><summary><span><b>${escH(title)}</b></span>${icon("chev", "chev")}</summary><div class="acc-b">${el.outerHTML}</div></details>`);
      title = null;
    }
  });
  return out.join("");
}
function renderPlan(){
  const m = modeOf(store.meta.week);
  hdr.innerHTML = `<div class="hdr-row"><h2 class="hdr-title">Plan</h2><span class="pill static">V9.4 · Cut-Block</span></div>`;
  const plan = {};
  DAYS.forEach(D => D.ex.forEach(ex =>{ const k = MUSCLE[ex.n] || "Sonstiges"; plan[k] = (plan[k] || 0) + setsIn(ex, m); }));
  main.innerHTML = `<div class="view">
    <p class="eyebrow">Woche ${store.meta.week} · ${MODES[m]} · ${totalSets(m)} Sätze</p>
    <h1 class="title">Dein Plan</h1>
    <p class="sub">5 Tage, Mittwoch und Sonntag frei · Priorität obere Brust, Lats und Arme</p>
    ${DAYS.map((D, d)=>{
      const total = D.ex.reduce((a, ex)=> a + setsIn(ex, m), 0);
      return `<details class="acc"${d === store.meta.day ? " open" : ""}><summary><span class="dk">${D.k}</span><span><b>${escH(D.n)} · ${escH(D.t)}</b><small>${escH(D.f)} · ${D.loc === "home" ? "Zuhause" : "Gym"} · ${total} Sätze</small></span>${icon("chev", "chev")}</summary>
        <div class="acc-b">${D.ex.map(ex => `<div class="pl-row"><div><b>${escH(ex.n)}</b><span>${escH(ex.h ? ex.h.replace(/^KSK · /, "Zuhause: ") : "Zuhause: gleiche Übung an der KSK")}</span></div>
          <div class="r">${setsIn(ex, m)} × ${ex.lo}–${ex.hi}<span>RIR ${escH(m === "deload" ? "3" : ex.rir)} · ${clock(ex.rest)}</span></div></div>`).join("")}
          <button class="btn sm block" data-act="goto-day" data-d="${d}">${icon("train", "sm")}${escH(D.n)} öffnen</button></div></details>`;
    }).join("")}
    <h3 class="sec-h">Direkte Sätze pro Muskel und Woche</h3>
    <section class="card"><table class="t"><thead><tr><th>Muskel</th><th>Sätze</th></tr></thead><tbody>${MUSCLE_ORDER.filter(k => plan[k]).map(k => `<tr><td>${PRIO.has(k) ? "★ " : ""}${escH(k)}</td><td>${plan[k]}</td></tr>`).join("")}</tbody></table>
      <p class="fine">★ Priorität. Indirekte Sätze (z. B. Bizeps beim Latzug) zählen etwa halb und sind hier nicht eingerechnet.</p></section>
    <h3 class="sec-h">Regeln & Wissen</h3>
    ${rulesAcc()}
  </div>`;
}

/* =====================================================================

}
function renderMore(){

      ${toggleRow("vibrate", "Vibration", "Beim Abhaken und am Pausenende (Android)", "phone")}

    </div>
    <h3 class="sec-h">Körper</h3>

      <button class="li" data-act="backup">${icon("copy")}<span class="lt"><b>Sicherung</b><span>Kompletter Stand als Text · Wiederherstellen</span></span>${icon("chevR", "sm")}</button>
    </div>

    <h3 class="sec-h">Über</h3>
    <div class="list"><div class="li">${icon("info")}<span class="lt"><b>Trainingslog</b><span>Plan V9.4 · App 2.0 · Datenformat ${PLAN}</span></span></div></div>
    <p class="fine">Nach einem Update die App einmal ganz schließen und neu öffnen.</p>
