/* ---------- Export und Sicherung ---------- */
function buildTSV(){
  const rows = [["Woche","Modus","Tag","Ort","Übung","Satz","Last (kg)","Wdh.","RIR"]];
  for(let w=1; w<=WEEKS; w++)
    DAYS.forEach((D, d)=> D.ex.forEach((ex, ei)=>{
      /* über ex.s hinaus: Sätze aus Wochen, bevor V9.1 die Satzzahl gesenkt hat */
      for(let s=1; s<=ex.s || get(w,d,ei,s); s++){
        const v = get(w,d,ei,s);
        if(v && (v.l !== "" || v.r !== ""))
          rows.push([w, MODES[modeOf(w)], D.n, locOf(w,d) === "home" ? "Zuhause" : "Gym", nameOf(w,d,ei), s, v.l, v.r, v.rir]);
      }
    }));
  const ci = Object.keys(store.checkin || {}).map(Number).sort((a, b)=> a - b);
  if(ci.length){
    rows.push([], ["Woche","Check-in","Gewicht Ø kg","Taille cm","Oberarm cm","Ruhepuls","Blutdruck","Schlaf Ø h","Appetit","Übelkeit","Notiz"]);
    ci.forEach(w =>{ const c = store.checkin[w]; rows.push([w, "", c.bw ?? "", c.waist ?? "", c.arm ?? "", c.rhr ?? "", c.bp ?? "", c.sleep ?? "", c.app ?? "", c.nau ?? "", c.note ?? ""]); });
  }
  return rows.map(r => r.join("\t")).join("\n");
}
function flash(btn, msg){ const t = btn.textContent; btn.textContent = msg; setTimeout(()=>{ btn.textContent = t; }, 1800); }
async function copyFrom(ta, btn){
  ta.focus(); ta.select(); ta.setSelectionRange(0, 9999999);
  let ok = false;
  try{ await navigator.clipboard.writeText(ta.value); ok = true; }
  catch(e){ try{ ok = document.execCommand("copy"); }catch(e2){ ok = false; } }
  flash(btn, ok ? "Kopiert" : "Markiert – jetzt kopieren");
}
function openExport(){
  openSheet("Export für Excel", `<p class="lead">Tabgetrennt. Kopieren, im Satzlog in die Spalten Last / Wdh. / RIR einfügen.</p>
    <textarea id="tx" readonly>${escH(buildTSV())}</textarea>
    <button class="btn primary block" data-sa="copy">${icon("copy", "sm")}Kopieren</button>`,
    {click: el =>{ if(el.dataset.sa === "copy") copyFrom($("#tx"), el); }});
}
let restoreT = null;
function openBackup(){
  openSheet("Sicherung", `<p class="lead">Der komplette Stand als Text – kopieren und in Notizen oder Dateien ablegen. Zum Zurückholen eine V9-Sicherung hier einfügen und „Wiederherstellen“ tippen.</p>
    <textarea id="bk" spellcheck="false">${escH(JSON.stringify(store))}</textarea>
    <div class="row2"><button class="btn primary" data-sa="copy">${icon("copy", "sm")}Kopieren</button><button class="btn" data-sa="restore">Wiederherstellen</button></div>`,
    {click: el =>{
      if(el.dataset.sa === "copy") return copyFrom($("#bk"), el);
      if(el.dataset.sa !== "restore") return;
      let data;
      try{ data = JSON.parse($("#bk").value); }catch(e){ return flash(el, "Text nicht lesbar"); }
      if(!data || typeof data !== "object" || !data.sets || !data.meta) return flash(el, "Keine gültige Sicherung");
      if(data.plan !== PLAN) return flash(el, "Andere Version – nicht übernommen");
      if(!el.classList.contains("armed")){
        el.classList.add("armed"); el.textContent = "Stand ersetzen?";
        clearTimeout(restoreT);
        restoreT = setTimeout(()=>{ el.classList.remove("armed"); el.textContent = "Wiederherstellen"; }, 4000);
        return;
      }
      clearTimeout(restoreT);
      store = data; normalize(); save();
      closeSheet(); toast("Sicherung wiederhergestellt"); render();
    }});
}

/* =====================================================================
   Blätter, Toast, Pausen-Uhr, Bildschirm, Ton
   ===================================================================== */
const sheet = $("#sheet"), shBody = $("#sh-body");
let shHandlers = null, lastFocus = null, sheetT = null;
function openSheet(title, html, handlers = {}){
  clearTimeout(sheetT);
  $("#sh-title").textContent = title;
  shBody.innerHTML = html; shHandlers = handlers;
  lastFocus = document.activeElement;
  sheet.hidden = false; document.body.classList.add("sheet-open");
  requestAnimationFrame(()=> requestAnimationFrame(()=> sheet.classList.add("open")));
  $(".sh", sheet).scrollTop = 0;
}
function closeSheet(){
  if(sheet.hidden) return;
  sheet.classList.remove("open"); shHandlers = null; document.body.classList.remove("sheet-open");
  sheetT = setTimeout(()=>{ sheet.hidden = true; shBody.innerHTML = ""; }, 280);
  if(lastFocus && lastFocus.isConnected && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
sheet.addEventListener("click", e =>{
  if(e.target === sheet || e.target.closest("#sh-close")) return closeSheet();
  const el = e.target.closest("[data-sa]");
  if(el && shHandlers && shHandlers.click) shHandlers.click(el, e);
});
sheet.addEventListener("change", e =>{ if(shHandlers && shHandlers.change) shHandlers.change(e.target); });

let toastT = null;
function toast(html, kind = ""){
  const el = $("#toast");
  el.innerHTML = html; el.className = `toast show ${kind}`;
  clearTimeout(toastT); toastT = setTimeout(()=>{ el.className = "toast"; }, 2800);
}
function haptic(){ if(setting("vibrate") && navigator.vibrate) navigator.vibrate(12); }

let actx = null;
function unlockAudio(){
  if(!setting("sound")) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  }catch(e){ actx = null; }
}
function beep(){
  if(!actx) return;
  try{
    [0, .24, .48].forEach(o =>{
      const t = actx.currentTime + o, osc = actx.createOscillator(), g = actx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(g).connect(actx.destination); osc.start(t); osc.stop(t + 0.2);
    });
  }catch(e){}
}

const dock = $("#dock"), T = {end:0, total:0, label:"", int:null, doneT:null};
function startTimer(sec, label){
  clearTimeout(T.doneT);
  T.total = sec; T.end = Date.now() + sec * 1000; T.label = label || "Pause";
  try{ sessionStorage.setItem("tl_timer", JSON.stringify({end:T.end, total:T.total, label:T.label})); }catch(e){}
  dock.hidden = false; dock.classList.remove("done"); document.body.classList.add("dock-on");
  clearInterval(T.int); T.int = setInterval(tick, 250); tick();
}
function startRest(ei){
  const {week, day} = store.meta, ex = DAYS[day].ex[ei];
  startTimer(ex.rest, nameOf(week, day, ei).replace(/^KSK · /, ""));
}
function tick(){
  const left = (T.end - Date.now()) / 1000;
  if(left <= 0) return finishTimer();
  $("#dk-time").textContent = clock(left);
  $("#dk-lbl").textContent = `Pause · ${T.label}`;
  const C = 2 * Math.PI * 19, val = $(".ring .val", dock);
  val.style.strokeDasharray = C; val.style.strokeDashoffset = C * (1 - left / T.total);
}
function finishTimer(){
  clearInterval(T.int); T.int = null; T.end = 0;
  try{ sessionStorage.removeItem("tl_timer"); }catch(e){}
  $("#dk-time").textContent = "Weiter geht's";
  $("#dk-lbl").textContent = `Pause vorbei · ${T.label}`;
  dock.classList.add("done");
  if(setting("vibrate") && navigator.vibrate) navigator.vibrate([220, 100, 220]);
  if(setting("sound")) beep();
  T.doneT = setTimeout(hideDock, 10000);
}
function hideDock(){
  clearInterval(T.int); clearTimeout(T.doneT); T.int = null; T.end = 0;
  dock.hidden = true; dock.classList.remove("done"); document.body.classList.remove("dock-on");
  try{ sessionStorage.removeItem("tl_timer"); }catch(e){}
}
function adjustTimer(d){
  if(!T.end){ if(d > 0) startTimer(d, T.label); return; }
  T.end += d * 1000; T.total = Math.max(1, T.total + d);
  if(T.end <= Date.now()) return finishTimer();
  try{ sessionStorage.setItem("tl_timer", JSON.stringify({end:T.end, total:T.total, label:T.label})); }catch(e){}
  tick();
}
function resumeTimer(){
  try{
    const t = JSON.parse(sessionStorage.getItem("tl_timer") || "null");
    if(t && t.end > Date.now()){
      T.total = t.total; T.end = t.end; T.label = t.label;
      dock.hidden = false; document.body.classList.add("dock-on");
      clearInterval(T.int); T.int = setInterval(tick, 250); tick();
    }
  }catch(e){}
}

let wakeLock = null;
async function syncWake(){
  const want = setting("wake") && view === "train" && document.visibilityState === "visible";
  try{
    if(want && !wakeLock && "wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    } else if(!want && wakeLock){ const l = wakeLock; wakeLock = null; await l.release(); }
  }catch(e){ wakeLock = null; }
}
/* Beim Wegwechseln sofort speichern: save() wartet sonst 0,4 s, und iOS kann
   die App in der Zeit beenden. */
function flushSave(){
  if(memoryOnly) return;
  clearTimeout(saveT);
  const json = JSON.stringify(store);
  try{
    if(backend === "claude") window.storage.set(KEY, json);
    else localStorage.setItem(KEY, json);
  }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden") flushSave();
  syncWake();
  if(document.visibilityState === "visible" && T.end) tick();
});
window.addEventListener("pagehide", flushSave);

/* =====================================================================
   Navigation und Ereignisse
   ===================================================================== */
function render(){
  $$(".tab").forEach(t =>{ const on = t.dataset.v === view; t.classList.toggle("on", on); t.setAttribute("aria-current", on ? "page" : "false"); });
  if(view === "train") renderTrain();
  else if(view === "progress") renderProgress();
  else if(view === "plan") renderPlan();
  else renderMore();
  syncWake();
}
function go(v){
  if(v === view){ window.scrollTo({top:0, behavior:"smooth"}); return; }
  view = v; window.scrollTo(0, 0); render();
}
function autoDay(){
  const k = todayKey();
  if(store.meta.lastDate === k) return;
  store.meta.lastDate = k;
  const d = DOW_DAY[new Date().getDay()];
  if(d != null) store.meta.day = d;
  save();
}

document.addEventListener("click", e =>{
  const tab = e.target.closest(".tab");
  if(tab) return go(tab.dataset.v);
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const {week, day} = store.meta;
  switch(b.dataset.act){
    case "week": return openWeek();
    case "loc": store.loc[lid(week, day)] = b.dataset.loc; save(); return render();
    case "day": store.meta.day = +b.dataset.d; save(); window.scrollTo(0, 0); return render();
    case "chk": return onCheck(b.closest(".set"));
    case "tech": return openTech(+b.closest(".ex").dataset.e);
    case "rest": unlockAudio(); return startRest(+b.closest(".ex").dataset.e);
    case "clear": return armClear(b);
    case "next-week": store.meta.week = Math.min(WEEKS, week + 1); save(); window.scrollTo(0, 0); return render();
    case "dismiss-next": store.meta.noSuggest = todayKey(); save(); return render();
    case "checkin": return openCheckin();
    case "goto-day": store.meta.day = +b.dataset.d; save(); view = "train"; window.scrollTo(0, 0); return render();
    case "toggle":{
      const k = b.dataset.k; setSetting(k, !setting(k));
      if(k === "sound" && setting(k)){ unlockAudio(); beep(); }
      return render();
    }
    case "export": return openExport();
    case "backup": return openBackup();
    case "cal":{
      const w = +b.dataset.w, d = +b.dataset.d, c = dayCount(w, d), info = $("#cal-info");
      $$(".cc.picked").forEach(x => x.classList.remove("picked")); b.classList.add("picked");
      info.innerHTML = `<b>Woche ${w} · ${escH(DAYS[d].n)}</b>: ${c.done} von ${c.due} Sätzen · ${fmt0(volumeOf(w, d))} kg <button class="btn sm" data-act="cal-open" data-w="${w}" data-d="${d}" style="margin-left:6px">Öffnen</button>`;
      return;
    }
    case "cal-open": store.meta.week = +b.dataset.w; store.meta.day = +b.dataset.d; save(); view = "train"; window.scrollTo(0, 0); return render();
    case "dk-minus": return adjustTimer(-15);
    case "dk-plus": return adjustTimer(15);
    case "dk-skip": return hideDock();
  }
});
document.addEventListener("input", e =>{ if(e.target.matches("#main .in")) liveMark(e.target); });
document.addEventListener("change", e =>{
  if(e.target.matches("#main .in")) return onInputCommit(e.target);
  if(e.target.id === "ex-pick"){ store.meta.pick = e.target.value; save(); drawExercise(historyIndex(), e.target.value); }
});
document.addEventListener("keydown", e =>{
  if(e.key === "Escape" && !sheet.hidden) return closeSheet();
  if(e.key === "Enter" && e.target.matches("#main .in")){
    const ins = $$(".in", e.target.closest(".set")), i = ins.indexOf(e.target);
    if(i < ins.length - 1) ins[i + 1].focus(); else e.target.blur();
    e.preventDefault();
  }
});
let resizeT = null;
window.addEventListener("resize", ()=>{ clearTimeout(resizeT); resizeT = setTimeout(()=>{ if(view === "progress"){ mountExercise(); mountBody(); } }, 200); });

/* ---------- Start ---------- */
(async function init(){
  $$(".tab").forEach(t => t.insertAdjacentHTML("afterbegin", icon(t.dataset.icon)));
  $("#sh-close").innerHTML = icon("x", "sm");
  $("#dk-skip").innerHTML = icon("x", "sm");
  /* Erst zeichnen, dann laden: die Oberfläche steht sofort, auch wenn der Speicher hakt. */
  render();
  try{ await load(); }
  catch(e){ memoryOnly = true; $("#warn").classList.add("on"); }
  autoDay();
  render();
  resumeTimer();
  if("serviceWorker" in navigator && location.protocol === "https:")
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
