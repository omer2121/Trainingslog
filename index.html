<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Log V6">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Trainingslog V6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12151A;
  --slab:#1B2028;
  --slab-2:#232935;
  --line:#2E3644;
  --paper:#E9ECF0;
  --steel:#8C97A6;
  --steel-dim:#5D6875;
  --go:#7BB661;
  --go-deep:#3E6B2E;
  --under:#CB6146;
  --amber:#D9A441;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
button,input,select{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}

/* ---------- Kopf ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:rgba(18,21,26,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 12px 0;
}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.brand{
  font-family:"IBM Plex Sans Condensed",sans-serif;
  font-weight:700;letter-spacing:.14em;font-size:11px;
  color:var(--steel-dim);text-transform:uppercase;
}
.pickers{margin-left:auto;display:flex;gap:6px}
.pick{
  background:var(--slab);border:1px solid var(--line);border-radius:7px;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.05em;padding:6px 8px;color:var(--paper);
  appearance:none;-webkit-appearance:none;
}
.days{display:flex;gap:5px;padding-bottom:9px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{
  flex:1 0 auto;min-width:58px;padding:9px 6px 8px;border-radius:8px;
  background:var(--slab);border:1px solid transparent;
  font-family:"IBM Plex Sans Condensed",sans-serif;
  text-align:center;transition:background .15s,border-color .15s;
}
.day b{display:block;font-size:14px;font-weight:700;letter-spacing:.08em}
.day span{display:block;font-size:9.5px;letter-spacing:.09em;color:var(--steel-dim);text-transform:uppercase;margin-top:1px}
.day.on{background:var(--slab-2);border-color:var(--steel-dim)}
.day.on b{color:var(--paper)}
.day.on span{color:var(--steel)}
.day.done b::after{content:"·";color:var(--go);margin-left:4px}

/* ---------- Fortschritt ---------- */
.meter{display:flex;align-items:center;gap:10px;padding:0 12px 9px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--steel-dim)}
#focus{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56%}
#cnt{flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ---------- Übungskarte ---------- */
main{padding:12px 12px 128px;max-width:640px;margin:0 auto}
.card{
  background:var(--slab);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:11px;overflow:hidden;
}
.card.flag-bulk{border-left:3px solid var(--go-deep)}
.card.flag-wk5{border-left:3px solid var(--amber)}
.chead{padding:11px 12px 10px;display:flex;gap:10px;align-items:flex-start}
.num{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--steel-dim);padding-top:3px;min-width:20px;
}
.cname{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:16.5px;line-height:1.22;letter-spacing:.005em;flex:1;
}
.cgrip{
  font-size:12.5px;color:var(--steel);line-height:1.4;margin-top:5px;
}
.cmeta{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--steel);
  margin-top:4px;letter-spacing:.01em;
}
.tag{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:9.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  align-self:flex-start;margin-top:2px;
}
.tag.bulk{background:rgba(123,182,97,.14);color:var(--go)}
.tag.wk5{background:rgba(217,164,65,.14);color:var(--amber)}

/* ---------- Satzzeile ---------- */
.sets{padding:0 12px 10px}
.set{
  display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:7px;align-items:center;
  padding:7px 0 7px 8px;border-top:1px solid var(--line);position:relative;
}
.set::before{
  content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;
  border-radius:2px;background:transparent;transition:background .25s;
}
.set.go::before{background:var(--go)}
.set.under::before{background:var(--under)}
.slab-label{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--steel-dim);
}
.f{position:relative}
.f input{
  width:100%;background:var(--slab-2);border:1px solid var(--line);
  border-radius:7px;padding:11px 6px 11px;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500;
  color:var(--paper);
}
.f input::placeholder{color:var(--steel-dim);font-weight:400}
.f input:focus{outline:2px solid var(--steel);outline-offset:1px;border-color:transparent}
.set.go .f.reps input{border-color:var(--go);color:var(--go)}
.set.under .f.reps input{border-color:var(--under);color:var(--under)}
.units{
  display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:7px;
  padding:6px 0 2px 8px;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--steel-dim);text-align:center;
}
.units span:first-child{text-align:left}

/* ---------- Geisterzeile: die Signatur ---------- */
.ghost{
  grid-column:2 / -1;display:flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--steel-dim);padding:1px 0 3px 2px;letter-spacing:.02em;
}
.ghost b{font-weight:500;color:var(--steel)}
.ghost .arrow{color:var(--steel-dim)}
.ghost.beat b{color:var(--go)}

/* ---------- Urteil ---------- */
.verdict{
  margin:2px 12px 11px;padding:9px 11px;border-radius:8px;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.02em;display:flex;gap:8px;align-items:baseline;
}
.verdict.up{background:rgba(123,182,97,.12);color:var(--go)}
.verdict.hold{background:var(--slab-2);color:var(--steel)}
.verdict.down{background:rgba(203,97,70,.12);color:var(--under)}
.verdict em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.8}

/* ---------- Cue ---------- */
.cue-t{
  width:100%;text-align:left;padding:9px 12px 11px;border-top:1px solid var(--line);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--steel-dim);
  display:flex;justify-content:space-between;align-items:center;
}
.cue-b{padding:0 12px 12px;font-size:13.5px;color:var(--steel);line-height:1.5;display:none}
.cue-b.open{display:block}
.cue-b .rest{
  display:block;margin-top:8px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--steel-dim);
}

/* ---------- Pausenuhr ---------- */
.timer{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;
  display:flex;align-items:center;gap:0;
  background:var(--slab-2);border:1px solid var(--line);
  border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.5);
  overflow:hidden;
}
.timer button{
  padding:12px 15px;font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel);
}
.timer .clock{
  font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;
  padding:10px 16px;min-width:88px;text-align:center;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.timer.run .clock{color:var(--go)}
.timer.done .clock{color:var(--amber)}

/* ---------- Werkzeugleiste / Export ---------- */
.tools{display:flex;gap:8px;margin:18px 0 6px}
.tool{
  flex:1;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--slab);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--steel);
}
.tool.arm{border-color:var(--under);color:var(--under);background:rgba(203,97,70,.10)}
.tool[hidden]{display:none}
.note{font-size:12px;color:var(--steel-dim);line-height:1.55;margin-top:12px}
.sheet{
  position:fixed;inset:0;z-index:80;background:rgba(10,12,16,.82);
  display:none;align-items:flex-end;
}
.sheet.open{display:flex}
.sheet-in{
  background:var(--slab);border-top-left-radius:14px;border-top-right-radius:14px;
  width:100%;max-height:82vh;padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  overflow:auto;border-top:1px solid var(--line);
}
.sheet h3{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim);margin:0 0 10px;
}
textarea{
  width:100%;height:190px;background:var(--ink);color:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:10px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.5;
}
.empty{
  text-align:center;padding:44px 20px;color:var(--steel-dim);
  font-family:"IBM Plex Sans Condensed",sans-serif;
}
.warn{
  margin:0 12px 10px;padding:9px 11px;border-radius:8px;font-size:12.5px;
  background:rgba(217,164,65,.12);color:var(--amber);display:none;
}
.warn.on{display:block}
.swapped{
  display:inline-block;margin-left:7px;padding:1px 6px;border-radius:4px;vertical-align:2px;
  background:rgba(217,164,65,.16);color:var(--amber);
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
}
.stall{
  display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(217,164,65,.3);
  font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;font-weight:400;
  color:var(--amber);line-height:1.45;letter-spacing:0;
}
.ghost.mism{color:var(--amber);opacity:.85}
.ghost.mism b{color:var(--amber)}
.alts{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.alt-h{
  font-family:"IBM Plex Sans Condensed",sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--steel-dim);margin-bottom:7px;
}
.alt{
  display:block;width:100%;text-align:left;margin-bottom:5px;padding:10px 11px;
  background:var(--slab-2);border:1px solid var(--line);border-radius:7px;
  font-size:13.5px;color:var(--steel);
}
.alt i{font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim);margin-left:5px}
.alt.on{border-color:var(--steel);background:var(--line);color:var(--paper)}
.alt-r{font-size:11.5px;color:var(--steel-dim);line-height:1.5;margin:9px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <span class="brand">Trainingslog V6</span>
    <div class="pickers">
      <select class="pick" id="week" aria-label="Woche"></select>
      <select class="pick" id="phase" aria-label="Phase">
        <option value="cut">Cut · 80</option>
        <option value="bulk">Bulk · 89</option>
        <option value="wk5">Bulk ab Wo. 5 · 94</option>
      </select>
    </div>
  </div>
  <nav class="days" id="days"></nav>
</header>

<div class="meter"><span id="focus"></span><span class="bar"><i id="fill"></i></span><span id="cnt">0/0</span></div>
<div class="warn" id="warn">Speicher nicht verfügbar – Eingaben gelten nur für diese Sitzung.</div>

<main id="main"></main>

<div class="timer" id="timer">
  <button id="t-reset">Reset</button>
  <span class="clock" id="t-clock">–:––</span>
  <button id="t-toggle">Start</button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h3 id="sheet-h">Export für Excel</h3>
    <p class="note" id="sheet-p" style="margin-top:0">Tabgetrennt. Kopieren, im Satzlog in die Spalten Last / Wdh. / RIR einfügen.</p>
    <textarea id="csv" readonly></textarea>
    <div class="tools">
      <button class="tool" id="sel">Kopieren</button>
      <button class="tool" id="restore" hidden>Wiederherstellen</button>
      <button class="tool" id="close">Schließen</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Programmdaten – identisch zum Satzlog der Excel-Datei
   t: 'schwer' | 'maschine' | 'iso'   s: [Cut, Bulk, ab Wo.5]
   ===================================================================== */

   g = Griff, Aufsatz und Einstellung - das, was die Uebung eindeutig macht. */
const DAYS = [
 {k:"MO", n:"Montag", t:"Upper A", f:"Obere Brust + schwere Rückendicke", ex:[
  {n:"Smith Machine Incline Press", g:"Bank 20–30° · pronierter Griff, gut schulterbreit · Stange zum Schlüsselbein",
   t:"schwer",   s:[3,3,3], lo:6,  hi:10, rir:"2 / 1–2", rest:180, cue:"Position: Stange zu festem Punkt über dem Schlüsselbein. Schulterblätter fixiert, Rippen unten."},
  {n:"Chest-Supported T-Bar Row", g:"Enger neutraler V-Griff · Brust bleibt am Pad",
   t:"schwer",   s:[3,3,3], lo:6,  hi:10, rir:"2 / 1–2", rest:180, cue:"Position: Griffe zu den unteren Rippen ziehen. Brust bleibt am Pad."},
  {n:"Neutral-Grip Lat Pulldown", g:"Paralleler Doppel-D-Griff, etwa schulterbreit · Daumen zueinander",
   t:"maschine", s:[2,3,3], lo:8,  hi:12, rir:"2 / 1–2", rest:150, cue:"Zielmuskel: Ellbogen nach unten zur Hüfte, nicht nach hinten. Minimale Rücklage."},
  {n:"Pec Deck (Butterfly)", g:"Griffe auf Brusthöhe · Ellbogen leicht gebeugt und fixiert",
   t:"iso",      s:[2,2,2], lo:10, hi:15, rir:"1 / 1",   rest:120, cue:"Zielmuskel: „Arme schließen“ denken, nicht „drücken“. Gedehnte Position kontrollieren."},
  {n:"Single-Arm Cable Lateral Raise", g:"Einzelgriff (D-Griff) am tiefsten Zug · Kabel läuft vor dem Körper",
   t:"iso",      s:[3,4,4], lo:12, hi:20, rir:"1 / 0–1", rest:105, cue:"Zielmuskel: mit dem Ellbogen führen, Arm in der Skapula-Ebene, kein Shrug."},
  {n:"Reverse Pec Deck (Rear Delt Fly)", g:"Griffe auf Schulterhöhe · neutraler Griff, Daumen oben",
   t:"iso",      s:[2,2,2], lo:12, hi:20, rir:"1 / 1",   rest:105, cue:"Zielmuskel: hintere Schulter initiiert, Trapez ruhig, kein Schwung."},
  {n:"Cross-Body Cable Triceps Extension", g:"Einzelgriff am hohen Zug · quer über den Körper nach unten außen",
   t:"iso",      s:[1,1,1], lo:10, hi:15, rir:"1 / 1",   rest:105, cue:"Zielmuskel: Oberarm fixiert, volle schmerzfreie Streckung."},
  {n:"Bayesian Cable Curl", g:"Einzelgriff am tiefsten Zug · Rücken zum Turm, Arm bleibt hinter dem Rumpf",
   t:"iso",      s:[1,1,1], lo:10, hi:15, rir:"1 / 1",   rest:105, cue:"Zielmuskel: Oberarm bleibt über die ganze Wiederholung hinter dem Rumpf."}]},

 {k:"DI", n:"Dienstag", t:"Lower A", f:"Quads + Beinbeuger + Waden", ex:[
  {n:"Single-Arm Cable Lateral Raise (Zusatz)", g:"Wie Montag: Einzelgriff, tiefster Zug, Kabel vor dem Körper",
   t:"iso",      s:[0,0,3], lo:12, hi:20, rir:"– / 0–1", rest:90,  cue:"Zielmuskel: gleicher Aufbau wie Montag. Bewusst vor den Beinübungen – am Ende leidet die Ausführung."},
  {n:"Hack Squat", g:"Füße mittig auf der Platte, schulterbreit · Zehen leicht nach außen",
   t:"schwer",   s:[3,3,3], lo:6,  hi:10, rir:"2 / 1–2", rest:210, cue:"Position: zwischen die Füße setzen, Knie wandern nach vorne, kein Abfedern unten."},
  {n:"Leg Press", g:"Füße mittig bis tief auf der Platte, schulterbreit",
   t:"maschine", s:[2,3,3], lo:10, hi:15, rir:"2 / 1–2", rest:150, cue:"Position: Schlitten über den ganzen Fuß wegdrücken; Becken bleibt an der Lehne."},
  {n:"Seated Leg Curl", g:"Pad tief über den Oberschenkeln · Rückenlehne aufrecht, Hüfte ~90°",
   t:"iso",      s:[3,3,3], lo:8,  hi:12, rir:"1 / 1",   rest:120, cue:"Zielmuskel: volle Dehnung je Wiederholung, Hüfte fixiert, keine verkürzten Wdh."},
  {n:"Leg Extension", g:"Drehachse auf Kniehöhe · Pad direkt über dem Sprunggelenk",
   t:"iso",      s:[2,2,2], lo:12, hi:20, rir:"1 / 0–1", rest:105, cue:"Zielmuskel: oben kurz anspannen, langsam ablassen."},
  {n:"Standing Calf Raise", g:"Fußballen auf der Kante · Knie fast gestreckt",
   t:"iso",      s:[3,3,3], lo:8,  hi:12, rir:"1 / 1",   rest:105, cue:"Zielmuskel: 2 s belastete Dehnung unten, volle Plantarflexion oben."},
  {n:"Cable Crunch", g:"Seil (Rope) am hohen Zug · kniend, Seil neben dem Kopf",
   t:"iso",      s:[2,2,2], lo:10, hi:15, rir:"1 / 1",   rest:105, cue:"Zielmuskel: Rippen Richtung Becken; Hüfte so ruhig wie möglich."}]},

 {k:"DO", n:"Donnerstag", t:"Pull", f:"Mittlere Rückendicke + Lats + hintere Schulter", ex:[
  {n:"Chest-Supported High Row", g:"Weiter pronierter Griff, Handrücken oben · Brust am Pad, Ellbogen 45–60°",
   t:"maschine", s:[3,3,3], lo:8,  hi:12, rir:"2 / 1–2", rest:150, cue:"Position: Ellbogen 45–60°, Griffe an den Rippen vorbei, Brust bleibt am Pad."},
  {n:"Single-Arm Lat Pulldown to Hip", g:"Einzelgriff (D-Griff) am hohen Zug · neutral, Zug zur Hosentasche",
   t:"maschine", s:[2,3,3], lo:10, hi:15, rir:"1 / 1",   rest:120, cue:"Zielmuskel: Ellbogen zur Hosentasche, Schulter unten, Rumpf ruhig."},
  {n:"Seated Cable Row, Ellbogen außen", g:"Weite gerade Stange, pronierter Griff · Zug zur oberen Brust",
   t:"maschine", s:[2,2,2], lo:10, hi:15, rir:"1 / 1",   rest:150, cue:"Zielmuskel: zur oberen Brust, zwischen den Schulterblättern zusammenziehen."},
  {n:"Chest-Supported Kelso Shrug", g:"Gleicher Griff wie die High Row · Arme fast gestreckt, nur Schulterblätter bewegen sich",
   t:"iso",      s:[2,2,2], lo:10, hi:15, rir:"1 / 1",   rest:120, cue:"Zielmuskel: Arme fast gestreckt – nur die Schulterblätter bewegen sich."},
  {n:"Reverse Pec Deck (Rear Delt Fly)", g:"Griffe auf Schulterhöhe · neutraler Griff, Daumen oben",
   t:"iso",      s:[2,3,3], lo:12, hi:20, rir:"1 / 0–1", rest:105, cue:"Zielmuskel: hintere Schulter führt, oberer Trapez bleibt ruhig."},
  {n:"Cable Preacher Curl", g:"SZ- oder gerade Stange am tiefen Zug · supinierter Griff, Oberarme fest am Pad",
   t:"iso",      s:[2,2,2], lo:8,  hi:12, rir:"1 / 1",   rest:105, cue:"Zielmuskel: Oberarme fest am Pad, volle ROM, kein Schultervorschub."},
  {n:"Rope Hammer Curl", g:"Seil (Rope) am tiefen Zug · neutraler Griff, Daumen oben",
   t:"iso",      s:[2,2,2], lo:10, hi:15, rir:"1 / 1",   rest:105, cue:"Zielmuskel: neutraler Griff, kein Hüftschwung, kontrolliert ablassen."}]},

const SWAP_OK = "Wechseln nur bei: Schmerz trotz sauberer Technik und reduzierter Last · Gerät nicht reproduzierbar einstellbar oder besetzt · Zielmuskel wird über mehrere Einheiten klar durch Gelenk oder anderen Muskel limitiert. Nicht wegen einem schlechten Training, fehlendem Muskelkater oder schwächerem Pump.";

const PHASE_IX = {cut:0, bulk:1, wk5:2};
const fmtRest = s => s < 120 ? `${s} s` : `${(s/60).toFixed(s%60 ? 1 : 0).replace(".", ",")} min`;
const KEY = "traininglog_v6";
let store = {meta:{week:1, phase:"cut", day:0}, sets:{}};
let memoryOnly = false;

/* ---------- Speicher ----------
   Läuft in zwei Umgebungen: innerhalb von Claude über window.storage,
   selbst gehostet über den Browser-Speicher. Getrennte Ablagen - die Daten
   wandern nicht von allein hinüber, dafür ist der Export da. */
let backend = "none";

/* Ohne Frist bleibt die App stehen, wenn die Speicherbruecke nie antwortet
   (z. B. im oeffentlich geteilten Artifact). Daher jeder Aufruf mit Timeout. */
const guard = (p, ms = 1500) => Promise.race([
  Promise.resolve(p),
  new Promise((_, rej) => setTimeout(() => rej(new Error("storage timeout")), ms))
]);

async function load(){
  if(typeof window.storage !== "undefined" && window.storage){
    try{
      const r = await guard(window.storage.get(KEY));
      backend = "claude";
      if(r && r.value) store = JSON.parse(r.value);
    }catch(e){
      try{ await guard(window.storage.set(KEY, JSON.stringify(store))); backend = "claude"; }
      catch(e2){ /* weiter zum Browser-Speicher */ }
    }
  }
  if(backend === "none"){
    try{
      localStorage.setItem(KEY + "_probe", "1");
      localStorage.removeItem(KEY + "_probe");
      backend = "local";
      const raw = localStorage.getItem(KEY);
      if(raw) store = JSON.parse(raw);
    }catch(e){
      memoryOnly = true;
      document.getElementById("warn").classList.add("on");
    }
  }
  if(!store.sets) store.sets = {};
  if(!store.var)  store.var  = {};
  if(!store.meta) store.meta = {week:1, phase:"cut", day:0};
}

let saveT = null;
function save(){
  if(memoryOnly) return;
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    const json = JSON.stringify(store);
    try{
      if(backend === "claude") await guard(window.storage.set(KEY, json), 3000);
      else localStorage.setItem(KEY, json);
    }catch(e){
      try{ localStorage.setItem(KEY, json); backend = "local"; }
      catch(e2){
        memoryOnly = true;
        document.getElementById("warn").classList.add("on");
      }
    }
  }, 420);
}

const id = (w,d,e,s)=>`w${w}|d${d}|e${e}|s${s}`;
const get = (w,d,e,s)=> store.sets[id(w,d,e,s)] || null;

/* letzte Woche mit Daten für denselben Satz */
function ghost(w,d,e,s){
  for(let k=w-1;k>=1;k--){
    const v = get(k,d,e,s);
    if(v && v.r) return {w:k, ...v};
  }
  return null;
}

/* ---------- gewählte Variante pro Woche/Tag/Übung ---------- */
const vid = (w,d,e)=>`w${w}|d${d}|e${e}`;
const variant = (w,d,e)=> (store.var && store.var[vid(w,d,e)]) || null;

/* ---------- Stillstand: 3 Einheiten gleiche Last und gleiche Wdh. ---------- */
function stalled(d, ei){
  const w = store.meta.week;
  const seen = [];
  for(let k=w; k>=1 && seen.length<3; k--){
    const v = get(k,d,ei,1);
    if(v && v.r) seen.push({l:v.l, r:v.r, w:k});
  }
  if(seen.length < 3) return null;
  const [a,b,c] = seen;
  if(a.l === b.l && b.l === c.l && a.r === b.r && b.r === c.r)
    return `${a.l} kg × ${a.r} in Wo. ${c.w}, ${b.w} und ${a.w}`;
  return null;
}

/* ---------- Urteil pro Übung ---------- */
function verdict(ex, d, ei, n){
  const w = store.meta.week;
  const vals = [];
  for(let s=1;s<=n;s++){
    const v = get(w,d,ei,s);
    if(!v || !v.r) return {k:"hold", txt:"Noch nicht vollständig geloggt", sub:""};
    vals.push(v);
  }
  const below = vals.filter(v=>v.r < ex.lo).length;
  if(below) return {k:"down", txt:"Last eine Stufe zurück", sub:`${below} Satz/Sätze unter ${ex.lo} Wdh.`};

  const iso = ex.t === "iso";
  const ok = iso ? vals.every(v=>v.r >= ex.hi)
                 : (vals[0].r >= ex.hi && vals.every(v=>v.r >= ex.lo));
  if(ok){
    const step = (ex.t === "schwer") ? "+1,25–2,5 kg"
               : (ex.t === "maschine") ? "+1 Pin" : "+1–2 kg";
    return {k:"up", txt:"Nächstes Mal Last erhöhen", sub:step};
  }
  return {k:"hold", txt:"Im Bereich – Last halten",
          sub: iso ? `alle Sätze auf ${ex.hi}` : `Satz 1 auf ${ex.hi}`};
}

/* ---------- Aufbau ---------- */
function setsFor(ex){ return ex.s[PHASE_IX[store.meta.phase]]; }

function render(){
  const {week, phase, day} = store.meta;
  const D = DAYS[day];
  const main = document.getElementById("main");
  main.innerHTML = "";

  let due = 0, done = 0;

  D.ex.forEach((ex, ei)=>{
    const n = setsFor(ex);
    if(n === 0) return;
    due += n;

    const card = document.createElement("section");
    card.className = "card";
    if(ex.s[0] === 0) card.classList.add(phase === "wk5" ? "flag-wk5" : "flag-bulk");
    else if(n > ex.s[0]) card.classList.add("flag-bulk");

    const tag = ex.s[0] === 0 ? '<span class="tag wk5">ab Wo. 5</span>'
              : (n > ex.s[0] ? '<span class="tag bulk">+Bulk</span>' : '');

    card.innerHTML = `
      <div class="chead">
        <span class="num">${String(ei+1).padStart(2,"0")}</span>
        <div style="flex:1">
          <div class="cname">${variant(week, day, ei) || ex.n}${variant(week, day, ei) ? '<span class="swapped">Alternative</span>' : ''}</div>
          ${variant(week, day, ei) ? '' : (ex.g ? `<div class="cgrip">${ex.g}</div>` : '')}
          <div class="cmeta">${ex.lo}–${ex.hi} Wdh · RIR ${ex.rir} · Pause ${fmtRest(ex.rest)}</div>
        </div>${tag}
      </div>
      <div class="units"><span></span><span>Last kg</span><span>Wdh.</span><span>RIR</span></div>
      <div class="sets"></div>
      <div class="verdict"></div>
      <button class="cue-t" aria-expanded="false">Cue, Pause &amp; Alternativen <span>+</span></button>
      <div class="cue-b">${ex.cue}<span class="rest">Pause ${fmtRest(ex.rest)} · Uhr unten starten</span>
        <div class="alts"></div>
      </div>`;

    const box = card.querySelector(".sets");
    for(let s=1;s<=n;s++){
      const cur = get(week, day, ei, s) || {};
      if(cur.r) done++;
      const g = ghost(week, day, ei, s);
      const gv = g ? (variant(g.w, day, ei) || ex.n) : null;
      const curV = variant(week, day, ei) || ex.n;
      const mismatch = g && gv !== curV;

      const row = document.createElement("div");
      row.className = "set";
      row.innerHTML = `
        <span class="slab-label">S${s}</span>
        <span class="f load"><input inputmode="decimal" placeholder="–" value="${cur.l ?? ""}"></span>
        <span class="f reps"><input inputmode="numeric" placeholder="–" value="${cur.r ?? ""}"></span>
        <span class="f rir"><input inputmode="numeric" placeholder="–" value="${cur.rir ?? ""}"></span>
        ${g ? `<span class="ghost${mismatch ? " mism" : ""}"><span class="arrow">↳</span> Wo.${g.w}: <b>${g.l ?? "–"} × ${g.r}</b>${g.rir!=null&&g.rir!==""?` @${g.rir}`:""}${mismatch ? ` · andere Übung (${gv}), nicht vergleichbar` : ""}</span>` : ""}`;

      const [li, ri, ii] = row.querySelectorAll("input");
      const mark = ()=>{
        const r = parseFloat(ri.value);
        row.classList.toggle("go", !isNaN(r) && r >= ex.hi);
        row.classList.toggle("under", !isNaN(r) && r < ex.lo && ri.value !== "");
        const gh = row.querySelector(".ghost");
        if(gh && g) gh.classList.toggle("beat", !isNaN(r) && g.r && r > g.r);
      };
      const commit = ()=>{
        const l = li.value.replace(",", ".");
        const rec = {l: l === "" ? "" : parseFloat(l),
                     r: ri.value === "" ? "" : parseInt(ri.value, 10),
                     rir: ii.value === "" ? "" : parseInt(ii.value, 10)};
        if(rec.l === "" && rec.r === "" && rec.rir === "") delete store.sets[id(week,day,ei,s)];
        else store.sets[id(week,day,ei,s)] = rec;
        save(); mark(); paintVerdict(); meter();
      };
      [li, ri, ii].forEach(inp=>{
        inp.addEventListener("input", ()=>{ mark(); });
        inp.addEventListener("change", commit);
        inp.addEventListener("blur", commit);
      });
      ri.addEventListener("change", ()=>{ if(ri.value) startTimer(ex.rest); });
      mark();
      box.appendChild(row);
    }

    const vEl = card.querySelector(".verdict");
    const paintVerdict = ()=>{
      const v = verdict(ex, day, ei, n);
      vEl.className = "verdict " + v.k;
      let html = `${v.txt}${v.sub ? ` <em>${v.sub}</em>` : ""}`;
      const st = stalled(day, ei);
      if(st) html += `<span class="stall">Stillstand · ${st} · zuerst Schlaf, Kalorien und Technik prüfen, Volumen zuletzt</span>`;
      vEl.innerHTML = html;
    };
    paintVerdict();

    /* Alternativen */
    const altBox = card.querySelector(".alts");
    const list = ALT[ex.n] || [];
    const cur = variant(week, day, ei);
    altBox.innerHTML = `<div class="alt-h">Alternative wählen</div>` +
      [ex.n, ...list].map(name =>
        `<button class="alt${(cur||ex.n) === name ? " on" : ""}" data-n="${name}">${name}${name === ex.n ? " <i>Standard</i>" : ""}</button>`
      ).join("") +
      `<p class="alt-r">${SWAP_OK}</p>`;
    altBox.querySelectorAll(".alt").forEach(btn=>{
      btn.onclick = ()=>{
        const name = btn.dataset.n;
        if(name === ex.n) delete store.var[vid(week, day, ei)];
        else store.var[vid(week, day, ei)] = name;
        save(); render();
      };
    });

    const t = card.querySelector(".cue-t"), b = card.querySelector(".cue-b");
    t.addEventListener("click", ()=>{
      const open = b.classList.toggle("open");
      t.setAttribute("aria-expanded", open);
      t.querySelector("span").textContent = open ? "−" : "+";
    });

    main.appendChild(card);
  });

  if(!due) main.innerHTML = `<p class="empty">In dieser Phase steht heute nichts an.<br>Phase oben umstellen.</p>`;

  const tools = document.createElement("div");
  tools.className = "tools";
  tools.innerHTML = `<button class="tool" id="exp">Export</button><button class="tool" id="bak">Sicherung</button>`;
  main.appendChild(tools);
  const tools2 = document.createElement("div");
  tools2.className = "tools";
  tools2.style.marginTop = "8px";
  tools2.innerHTML = `<button class="tool" id="clr">Tag leeren</button>`;
  main.appendChild(tools2);
  const note = document.createElement("p");
  note.className = "note";
  note.textContent = "Grün = oberes Ende des Zielbereichs erreicht. Rot = unter dem Bereich, Last eine Stufe zurück. Die graue Zeile unter jedem Satz zeigt, was du beim letzten Mal geschafft hast.";
  main.appendChild(note);
  const stat = document.createElement("p");
  stat.className = "note";
  stat.textContent = memoryOnly ? ""
    : backend === "claude" ? "Speicher: Claude – Eingaben bleiben über Sitzungen erhalten."
    : "Speicher: dieses Gerät. Nach jeder Woche eine Sicherung ziehen – iOS räumt Website-Daten irgendwann auf.";
  if(stat.textContent) main.appendChild(stat);

  document.getElementById("exp").onclick = exportTSV;
  document.getElementById("bak").onclick = backupJSON;
  const clrBtn = document.getElementById("clr");
  let armed = false, armT = null;
  const disarm = ()=>{ armed = false; clearTimeout(armT); clrBtn.textContent = "Tag leeren"; clrBtn.classList.remove("arm"); };
  clrBtn.onclick = ()=>{
    if(!armed){
      armed = true;
      clrBtn.textContent = `${D.n} Wo. ${week} leeren?`;
      clrBtn.classList.add("arm");
      armT = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    Object.keys(store.sets).forEach(k=>{ if(k.startsWith(`w${week}|d${day}|`)) delete store.sets[k]; });
    Object.keys(store.var).forEach(k=>{ if(k.startsWith(`w${week}|d${day}|`)) delete store.var[k]; });
    save(); render();
  };

  document.getElementById("focus").textContent = D.f;
  document.getElementById("cnt").textContent = `${done}/${due}`;
  document.getElementById("fill").style.width = due ? (done/due*100)+"%" : "0%";
  paintDays();
}

function meter(){
  const {week, day} = store.meta;
  let due = 0, done = 0;
  DAYS[day].ex.forEach((ex, ei)=>{
    const n = setsFor(ex); due += n;
    for(let s=1;s<=n;s++){ const v = get(week,day,ei,s); if(v && v.r) done++; }
  });
  document.getElementById("cnt").textContent = `${done}/${due}`;
  document.getElementById("fill").style.width = due ? (done/due*100)+"%" : "0%";
  paintDays();
}

function paintDays(){
  [...document.querySelectorAll(".day")].forEach((el, i)=>{
    el.classList.toggle("on", i === store.meta.day);
    const has = Object.keys(store.sets).some(k=>k.startsWith(`w${store.meta.week}|d${i}|`));
    el.classList.toggle("done", has);
  });
}

/* ---------- Pausenuhr ---------- */
let tEnd = 0, tLeft = 0, tInt = null;
const tim = document.getElementById("timer"),
      clk = document.getElementById("t-clock"),
      tog = document.getElementById("t-toggle");
function fmt(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function tick(){
  const left = (tEnd - Date.now())/1000;
  clk.textContent = fmt(left);
  if(left <= 0){
    clearInterval(tInt); tInt = null;
    tim.classList.remove("run"); tim.classList.add("done");
    tog.textContent = "Start";
    if(navigator.vibrate) navigator.vibrate([180,90,180]);
  }
}
function startTimer(sec){
  tLeft = sec; tEnd = Date.now() + sec*1000;
  clearInterval(tInt); tInt = setInterval(tick, 250);
  tim.classList.add("run"); tim.classList.remove("done");
  tog.textContent = "Stopp"; tick();
}
tog.onclick = ()=>{
  if(tInt){ clearInterval(tInt); tInt = null; tim.classList.remove("run"); tog.textContent = "Start"; }
  else startTimer(tLeft || 120);
};
document.getElementById("t-reset").onclick = ()=>{
  clearInterval(tInt); tInt = null; tim.className = "timer";
  clk.textContent = "–:––"; tog.textContent = "Start"; tLeft = 0;
};

/* ---------- Export ---------- */
const $csv = ()=> document.getElementById("csv");

function exportTSV(){
  const rows = [["Woche","Tag","Übung","Griff / Einstellung","Satz","Last (kg)","Wdh.","RIR"]];
  for(let w=1; w<=10; w++)
    DAYS.forEach((D, d)=> D.ex.forEach((ex, ei)=>{
      for(let s=1; s<=Math.max(...ex.s); s++){
        const v = get(w,d,ei,s);
        if(v && (v.l !== "" || v.r !== "")){
          const alt = variant(w,d,ei);
          rows.push([w, D.n, alt || ex.n, alt ? "Alternative" : (ex.g || ""), s, v.l, v.r, v.rir]);
        }
      }
    }));
  const t = $csv();
  t.value = rows.map(r=>r.join("\t")).join("\n");
  t.readOnly = true;
  document.getElementById("sheet-h").textContent = "Export für Excel";
  document.getElementById("sheet-p").textContent = "Tabgetrennt. Kopieren, im Satzlog in die Spalten Last / Wdh. / RIR einfügen.";
  document.getElementById("restore").hidden = true;
  document.getElementById("sheet").classList.add("open");
}

/* Sicherung: kompletter Stand als Text, wieder einlesbar. */
function backupJSON(){
  const t = $csv();
  t.value = JSON.stringify(store);
  t.readOnly = false;
  document.getElementById("sheet-h").textContent = "Sicherung";
  document.getElementById("sheet-p").textContent = "Der komplette Stand als Text – kopieren und in Notizen oder Dateien ablegen. Zum Zurückholen eine alte Sicherung hier einfügen und Wiederherstellen tippen.";
  document.getElementById("restore").hidden = false;
  document.getElementById("sheet").classList.add("open");
}

(function(){
  const rb = document.getElementById("restore");
  let armed = false, armT = null;
  const flash = msg =>{ rb.textContent = msg; setTimeout(()=>{ rb.textContent = "Wiederherstellen"; }, 2200); };
  const disarm = ()=>{ armed = false; clearTimeout(armT); rb.classList.remove("arm"); rb.textContent = "Wiederherstellen"; };
  rb.onclick = ()=>{
    let data;
    try{ data = JSON.parse($csv().value); }
    catch(e){ disarm(); flash("Text nicht lesbar"); return; }
    if(!data || typeof data !== "object" || !data.sets || !data.meta){ disarm(); flash("Keine gültige Sicherung"); return; }
    if(!armed){
      armed = true; rb.classList.add("arm");
      rb.textContent = "Stand ersetzen?";
      armT = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    store = data;
    if(!store.var) store.var = {};
    save();
    document.getElementById("week").value = store.meta.week;
    document.getElementById("phase").value = store.meta.phase;
    document.getElementById("sheet").classList.remove("open");
    render();
  };
})();
document.getElementById("sel").onclick = async ()=>{
  const t = document.getElementById("csv"), btn = document.getElementById("sel");
  t.focus(); t.select(); t.setSelectionRange(0, 99999);
  let ok = false;
  try{ await navigator.clipboard.writeText(t.value); ok = true; }
  catch(e){ try{ ok = document.execCommand("copy"); }catch(e2){ ok = false; } }
  btn.textContent = ok ? "Kopiert" : "Markiert – jetzt kopieren";
  setTimeout(()=>{ btn.textContent = "Kopieren"; }, 1800);
};
document.getElementById("close").onclick = ()=> document.getElementById("sheet").classList.remove("open");

/* ---------- Start ---------- */
(async function init(){
  const wsel = document.getElementById("week");
  for(let i=1;i<=10;i++) wsel.add(new Option(`Woche ${i}`, i));
  wsel.onchange = ()=>{ store.meta.week = +wsel.value; save(); render(); };

  const psel = document.getElementById("phase");
  psel.onchange = ()=>{ store.meta.phase = psel.value; save(); render(); };

  const nav = document.getElementById("days");
  DAYS.forEach((D, i)=>{
    const b = document.createElement("button");
    b.className = "day";
    b.innerHTML = `<b>${D.k}</b><span>${D.t}</span>`;
    b.onclick = ()=>{ store.meta.day = i; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); };
    nav.appendChild(b);
  });

  const sync = ()=>{ wsel.value = store.meta.week; psel.value = store.meta.phase; };

  /* Erst zeichnen, dann laden: die Oberflaeche steht sofort,
     auch wenn der Speicher hakt. */
  sync(); render();

  try{ await load(); }
  catch(e){
    memoryOnly = true;
    document.getElementById("warn").classList.add("on");
  }

  sync(); render();

  if("serviceWorker" in navigator && location.protocol === "https:"){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
})();
</script>
