<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraftbuch">
<meta name="description" content="Krafttraining planen und loggen: einfach, offline und ohne Konto.">
<title>Kraftbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr"></header>
  <main id="main"></main>
</div>
<div class="dock" id="dock" hidden role="timer" aria-live="polite">
  <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle class="trk" cx="23" cy="23" r="19"/><circle class="val" cx="23" cy="23" r="19"/></svg>
  <div class="dk-mid"><b id="dk-time">0:00</b><span id="dk-lbl">Pause</span></div>
  <button class="dk-b" data-act="dk-minus" aria-label="15 Sekunden weniger">−15</button>
  <button class="dk-b" data-act="dk-plus" aria-label="15 Sekunden mehr">+15</button>
  <button class="dk-b" data-act="dk-skip" id="dk-skip" aria-label="Pause beenden"></button>
</div>
<nav class="tabbar" aria-label="Bereiche"><div class="tabbar-in">
  <button class="tab" data-v="train" data-icon="train">Training</button>
  <button class="tab" data-v="progress" data-icon="progress">Fortschritt</button>
  <button class="tab" data-v="plan" data-icon="plan">Plan</button>
  <button class="tab" data-v="more" data-icon="more">Mehr</button>
</div></nav>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="sh"><div class="grab"></div><div class="sh-head"><h2 id="sh-title"></h2><button class="sh-x" id="sh-close" aria-label="Schließen"></button></div><div id="sh-body"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
